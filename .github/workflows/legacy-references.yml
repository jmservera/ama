name: Legacy reference guard

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-references-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  legacy-references:
    name: legacy-references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Retired mvp and prototype references name the archive tag
        run: python3 tools/check-legacy-references.py --files
      - name: Checker tests
        run: python3 -m unittest tools/test_check_legacy_references.py -v
