name: MVP CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mvp-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No test sandboxes are tracked
        run: |
          if git ls-files -- '*/.assistant-test-*' | grep -q .; then
            echo "Tracked test sandbox files found:"; git ls-files -- '*/.assistant-test-*'; exit 1
          fi
      - name: Install the source packages
        run: pip install --no-deps -e src/core -e src/agents -e src/api -e src/orchestrator
      - name: Unit, API, role matrix, ledger and AI evaluation tests
        run: |
          (cd src/api && PYTHONPATH=../core/tests:../agents/tests python3 -m unittest discover -s tests)
          (cd src/orchestrator && PYTHONPATH=../core/tests python3 -m unittest discover -s tests)
      - name: Check browser JavaScript syntax
        run: node --check src/api/src/zava_forward/api/web/app.js && node --check src/api/src/zava_forward/api/web/assistants.js

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build image
        run: |
          chmod 600 src/api/src/zava_forward/api/web/zava-logo.png
          docker build -f src/api/Dockerfile -t zavaforward-mvp:ci src
      - name: Image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id zavaforward-mvp:ci -u)" = "10001"
      - name: Image contains no working data
        run: docker run --rm --entrypoint sh zavaforward-mvp:ci -c 'test ! -e /app/data && test ! -e /data/zavaforward.json'
      - name: Image runs with a read-only root file system and no capabilities
        run: |
          mkdir -p "$RUNNER_TEMP/seed"
          echo '{"cases":[],"staff":[]}' > "$RUNNER_TEMP/seed/zavaforward.json"
          chmod -R a+rX "$RUNNER_TEMP/seed"
          docker run -d --name zf-ro --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp --tmpfs /state:uid=10001,gid=10001 -p 8088:8088 \
            -v "$RUNNER_TEMP/seed:/data:ro" zavaforward-mvp:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8088/healthz && ok=1 && break
            sleep 1
          done
          test "${ok:-0}" = 1 || { docker logs zf-ro; docker rm -f zf-ro; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          with urlopen("http://127.0.0.1:8088/zava-logo.png", timeout=10) as response:
              assert response.status == 200
              assert response.headers["Content-Type"] == "image/png"
              assert response.read() == Path("src/api/src/zava_forward/api/web/zava-logo.png").read_bytes()
          PY
          docker exec zf-ro sh -c 'touch /state/probe && ! touch /app/probe 2>/dev/null && ! touch /probe 2>/dev/null'
          docker exec zf-ro sh -c 'grep -q "^CapEff:.0000000000000000$" /proc/1/status'
          docker rm -f zf-ro
      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: zavaforward-mvp:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          vuln-type: os,library
          ignore-unfixed: true
      - name: Generate SBOM (SPDX)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: zavaforward-mvp:ci
          format: spdx-json
          output: zavaforward-mvp.spdx.json
          scan-type: image
          skip-setup-trivy: true
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zavaforward-mvp-sbom
          path: zavaforward-mvp.spdx.json

  mssql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Zf-Test-12345!"
        ports: ["1433:1433"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install driver system libraries
        run: sudo apt-get update && sudo apt-get install -y libltdl7 libkrb5-3
      - name: Install pinned driver
        run: pip install --require-hashes -r src/api/requirements.txt && pip install --no-deps -e src/core -e src/agents -e src/api -e src/orchestrator
      - name: Store and five-assistant contracts on SQL Server
        env:
          ZF_TEST_MSSQL: "1"
          ZF_SQL_SERVER: localhost
          ZF_SQL_DATABASE: master
          ZF_SQL_AUTH: password
          ZF_SQL_USER: sa
          ZF_SQL_PASSWORD: "Zf-Test-12345!"
          ZF_SQL_TRUST_CERT: "1"
        run: |
          cd src/api
          PYTHONPATH=tests:../core/tests:../agents/tests python3 -m unittest test_mssqlstore test_lawstore.MssqlStoreTests \
            test_assistants.MssqlContractTests test_assistants.MssqlReviewTests \
            test_assistants.MssqlDurabilityTests test_assistants.MssqlApiTests \
            test_assistants.MssqlLedgerTests test_resident_aoai_sql.AccountingSqlTests
