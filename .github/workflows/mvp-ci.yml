name: MVP CI

on:
  pull_request:
    paths: ["mvp/**", ".github/workflows/mvp-ci.yml"]
  push:
    branches: [main]
    paths: ["mvp/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mvp-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit, API, role matrix, ledger and AI evaluation tests
        run: cd mvp && PYTHONPATH=. python3 -m unittest discover -s tests
      - name: Check browser JavaScript syntax
        run: node --check mvp/web/app.js

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t properwarm-mvp:ci mvp
      - name: Image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id properwarm-mvp:ci -u)" = "10001"
      - name: Image contains no working data
        run: docker run --rm --entrypoint sh properwarm-mvp:ci -c 'test ! -e /app/data && test ! -e /data/properwarm.json'

  mssql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Pw-Test-12345!"
        ports: ["1433:1433"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install driver system libraries
        run: sudo apt-get update && sudo apt-get install -y libltdl7 libkrb5-3
      - name: Install pinned driver
        run: pip install --require-hashes -r mvp/requirements.txt
      - name: Store parity tests on SQL Server
        env:
          PW_TEST_MSSQL: "1"
          PW_SQL_SERVER: localhost
          PW_SQL_DATABASE: master
          PW_SQL_AUTH: password
          PW_SQL_USER: sa
          PW_SQL_PASSWORD: "Pw-Test-12345!"
          PW_SQL_TRUST_CERT: "1"
        run: cd mvp && PYTHONPATH=.:tests python3 -m unittest test_mssqlstore
