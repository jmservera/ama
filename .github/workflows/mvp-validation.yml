name: MVP validation

on:
  pull_request:
    paths: ["mvp/**", "src/core/**", "src/agents/tests/**", "infra/**", ".github/workflows/mvp-validation.yml"]
  push:
    branches: [main]
    paths: ["mvp/**", "src/core/**", "src/agents/tests/**", "infra/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mvp-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the core package that mvp imports
        run: pip install --no-deps -e src/core
      - name: Compile
        run: python -m compileall -q mvp/zavaforward_mvp src/core/src
      - name: Unit and API tests
        working-directory: mvp
        env:
          PYTHONPATH: .:../src/core/tests:../src/agents/tests
        run: python -m unittest discover -s tests -v
      - name: Show Azure CLI and Bicep
        run: az bicep version
      - name: API authentication initialization tests
        env:
          REQUIRE_AZ_BICEP: "1"
        run: python -m unittest discover -s infra/tests -v
      - name: Build and lint infrastructure
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep
      - name: Check browser JavaScript syntax
        run: node --check mvp/web/app.js
      - name: Refuse committed working data
        run: test -z "$(git ls-files mvp/data)"
