name: MVP validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mvp-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the source packages
        run: pip install --no-deps -e src/core -e src/agents -e src/api -e src/orchestrator
      - name: Compile
        run: python -m compileall -q src/core/src src/agents/src src/api/src src/orchestrator/src
      - name: Unit and API tests
        working-directory: src/api
        env:
          PYTHONPATH: ../core/tests:../agents/tests
        run: python -m unittest discover -s tests -v
      - name: Show Azure CLI and Bicep
        run: az bicep version
      - name: API authentication initialization tests
        env:
          REQUIRE_AZ_BICEP: "1"
        run: |
          pip install 'PyYAML==6.0.3'
          pip install --require-hashes -r src/api/requirements.txt
          python -m unittest discover -s infra/tests -v
      - name: Build and lint infrastructure
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep
      - name: Check browser JavaScript syntax
        run: node --check src/api/src/zava_forward/api/web/app.js
      - name: Refuse committed working data
        run: test -z "$(git ls-files mvp/data ':(glob)src/**/data/**')"
      - name: Branding migration regressions
        run: |
          pip install -r tools/rename-zava-requirements.txt
          python3 tools/rename-zava-tests.py
