name: Prototype validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Detect prototype after checkout
        id: detect
        shell: bash
        run: |
          if [[ -d prototype ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Proper Warm prototype validation"
              echo
              echo "No \`prototype/\` directory exists on this commit. No prototype checks ran; this is not prototype test evidence."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Python
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install prototype dependencies
        if: steps.detect.outputs.present == 'true'
        run: python -m pip install --disable-pip-version-check --no-input -r prototype/requirements.txt

      - name: Compile Python modules
        if: steps.detect.outputs.present == 'true'
        run: python -m compileall -q prototype/properwarm

      - name: Run standard-library unit tests
        if: steps.detect.outputs.present == 'true'
        run: python -m unittest discover -s prototype/tests -v

      - name: Run offline agent contract evaluation
        if: steps.detect.outputs.present == 'true'
        env:
          PYTHONPATH: prototype
          EVALUATION_REPORT: ${{ runner.temp }}/proper-warm-offline-agent-evaluation.json
        run: |
          python prototype/scripts/evaluate_agent.py --out "$EVALUATION_REPORT"
          python -c "import json, os; report=json.load(open(os.environ['EVALUATION_REPORT'], encoding='utf-8')); assert report['execution'] == 'offline-contract-only', report['execution']; assert report['contract_pass_rate'] == 1, report['contract_pass_rate']; print(f\"Offline contract evaluation: {report['cases']} cases, pass rate {report['contract_pass_rate']:.0%}; no live inference.\")"

      - name: Check browser JavaScript syntax
        if: steps.detect.outputs.present == 'true'
        run: node --check prototype/web/app.js

      - name: Summarize completed validation
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          {
            echo "## Proper Warm prototype validation"
            echo
            echo "Python compilation, standard-library unittests, the offline contract-double evaluation, and JavaScript syntax checks completed."
            echo
            echo "No live model inference, Azure credentials, deployment, or production services were used."
          } >> "$GITHUB_STEP_SUMMARY"
