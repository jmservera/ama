<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#3d647a"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="40" y="105" width="1720" height="205" rx="10" fill="#f4f7fa" stroke="#8ba0b1" stroke-width="1.5"/><text x="58" y="136" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#52687a" text-anchor="start"><tspan x="58" dy="0">1  Resident and assisted access</tspan></text><rect x="40" y="340" width="1720" height="290" rx="10" fill="#f4f7fa" stroke="#8ba0b1" stroke-width="1.5"/><text x="58" y="371" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#52687a" text-anchor="start"><tspan x="58" dy="0">2  Shared case authority and event record</tspan></text><rect x="40" y="665" width="1720" height="430" rx="10" fill="#f4f7fa" stroke="#8ba0b1" stroke-width="1.5"/><text x="58" y="696" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#52687a" text-anchor="start"><tspan x="58" dy="0">3  Controlled documents and bounded answer task</tspan></text><rect x="100" y="175" width="270" height="85" rx="10" fill="#e8f3fb" stroke="#286b91" stroke-width="2"/><text x="235" y="211.2" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#286b91" text-anchor="middle"><tspan x="235" dy="0">Resident / representative</tspan><tspan x="235" dy="27.3">portal</tspan></text><rect x="465" y="175" width="290" height="85" rx="10" fill="#f3edfa" stroke="#76559c" stroke-width="2"/><text x="610" y="211.5" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#76559c" text-anchor="middle"><tspan x="610" dy="0">Managed external identity</tspan><tspan x="610" dy="26">(candidate; provider open)</tspan></text><rect x="900" y="175" width="300" height="85" rx="10" fill="#eef5e9" stroke="#4c7b46" stroke-width="2"/><text x="1050" y="211.8" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#4c7b46" text-anchor="middle"><tspan x="1050" dy="0">Assisted phone / email / visit</tspan><tspan x="1050" dy="24.7">(manual capture unless verified)</tspan></text><rect x="1300" y="175" width="380" height="85" rx="10" fill="#fff1e5" stroke="#b2682d" stroke-width="2"/><text x="1490" y="211.8" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#b2682d" text-anchor="middle"><tspan x="1490" dy="0">Independent person / urgent-help route</tspan><tspan x="1490" dy="24.7">(not dependent on the model)</tspan></text><rect x="105" y="435" width="340" height="115" rx="10" fill="#e8f3fb" stroke="#286b91" stroke-width="2"/><text x="275" y="486.2" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#286b91" text-anchor="middle"><tspan x="275" dy="0">Resident API boundary</tspan><tspan x="275" dy="27.3">projection + validated writes</tspan></text><rect x="535" y="435" width="300" height="115" rx="10" fill="#f3edfa" stroke="#76559c" stroke-width="2"/><text x="685" y="486.8" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#76559c" text-anchor="middle"><tspan x="685" dy="0">Current scoped grants</tspan><tspan x="685" dy="24.7">case / field / task / representative</tspan></text><rect x="925" y="435" width="300" height="115" rx="10" fill="#eef5e9" stroke="#4c7b46" stroke-width="2"/><text x="1075" y="486.5" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#4c7b46" text-anchor="middle"><tspan x="1075" dy="0">Existing case authority</tspan><tspan x="1075" dy="26">SQL/state candidate; verify fit</tspan></text><rect x="1320" y="435" width="355" height="115" rx="10" fill="#fff7df" stroke="#9a7724" stroke-width="2"/><text x="1497.5" y="486.5" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#9a7724" text-anchor="middle"><tspan x="1497.5" dy="0">Shared event + outbox</tspan><tspan x="1497.5" dy="26">provenance / replay / exceptions</tspan></text><rect x="105" y="765" width="320" height="115" rx="10" fill="#fff1e5" stroke="#b2682d" stroke-width="2"/><text x="265" y="816.5" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#b2682d" text-anchor="middle"><tspan x="265" dy="0">Upload quarantine</tspan><tspan x="265" dy="26">no reader/model access</tspan></text><rect x="505" y="765" width="340" height="115" rx="10" fill="#fff7df" stroke="#9a7724" stroke-width="2"/><text x="675" y="816.8" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#9a7724" text-anchor="middle"><tspan x="675" dy="0">Scan → human review</tspan><tspan x="675" dy="24.7">clean ≠ accepted ≠ published</tspan></text><rect x="925" y="750" width="330" height="140" rx="10" fill="#e8f3fb" stroke="#286b91" stroke-width="2"/><text x="1090" y="814.3" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#286b91" text-anchor="middle"><tspan x="1090" dy="0">Registered resident-answer task</tspan><tspan x="1090" dy="24.7">one bounded call; no memory/agents</tspan></text><rect x="1360" y="740" width="315" height="120" rx="10" fill="#eef5e9" stroke="#4c7b46" stroke-width="2"/><text x="1517.5" y="794.3" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#4c7b46" text-anchor="middle"><tspan x="1517.5" dy="0">Human review + owned queue</tspan><tspan x="1517.5" dy="24.7">all replies reviewed by default</tspan></text><rect x="1360" y="920" width="315" height="90" rx="10" fill="#fcebec" stroke="#a3474b" stroke-width="2"/><text x="1517.5" y="959" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#a3474b" text-anchor="middle"><tspan x="1517.5" dy="0">Simulated outbox only</tspan><tspan x="1517.5" dy="26">no live send authority</tspan></text><text x="920" y="927" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#40596c" text-anchor="start"><tspan x="920" dy="0">Answer sources: authorized projection + approved docs only.</tspan><tspan x="920" dy="21.25">Stale / missing / conflict → abstain and hand off.</tspan></text><polyline points="370,218 465,218" fill="none" stroke="#3d647a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><polyline points="610,260 610,320 270,320 270,435" fill="none" stroke="#76559c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><polyline points="1050,260 1050,330 275,330 275,435" fill="none" stroke="#4c7b46" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><polyline points="445,493 535,493" fill="none" stroke="#3d647a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><polyline points="835,493 925,493" fill="none" stroke="#3d647a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><polyline points="1225,493 1320,493" fill="none" stroke="#3d647a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><polyline points="105,500 70,500 70,805 105,805" fill="none" stroke="#b2682d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><polyline points="425,820 505,820" fill="none" stroke="#b2682d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><polyline points="1495,550 1495,700 1517,700 1517,740" fill="none" stroke="#9a7724" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><polyline points="1075,550 1075,700 1090,700 1090,750" fill="none" stroke="#286b91" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><polyline points="1255,820 1360,800" fill="none" stroke="#286b91" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><polyline points="1517,860 1517,920" fill="none" stroke="#a3474b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><polyline points="1680,218 1730,218 1730,705 1517,705 1517,740" fill="none" stroke="#b2682d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 8" marker-end="url(#arrow)"/><text x="90" y="1137" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#334e60" text-anchor="start"><tspan x="90" dy="0">Boundary: resident identity ≠ entitlement; address ≠ authority; appointment response ≠ consent. Per-message review stays ON; routine automation OFF.</tspan></text></svg>