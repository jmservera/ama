<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#173f35"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="12" fill="#faf9f6" stroke="#faf9f6" stroke-width="2"/><text x="64" y="79" font-family="Arial, sans-serif" font-size="37" fill="#173f35"><tspan x="64" dy="0">One API coordinates the work; models do not own state.</tspan></text><text x="64" y="123" font-family="Arial, sans-serif" font-size="21" fill="#50655e"><tspan x="64" dy="0">Current source contracts; historical deployment proof is not current end-to-end acceptance.</tspan></text><rect x="64" y="198" width="390" height="195" rx="12" fill="#e8f1ed" stroke="#173f35" stroke-width="2"/><text x="86" y="248" font-family="Arial, sans-serif" font-size="26" fill="#173f35"><tspan x="86" dy="0">Staff browser</tspan></text><text x="86" y="305" font-family="Arial, sans-serif" font-size="23" fill="#173f35"><tspan x="86" dy="0">Resident-assisted routes</tspan><tspan x="86" dy="28.75">No mandatory resident portal</tspan></text><path d="M464,285 l66,0" fill="none" stroke="#173f35" stroke-width="3" marker-end="url(#arrow)"/><rect x="540" y="198" width="520" height="195" rx="12" fill="#e8f1ed" stroke="#173f35" stroke-width="2"/><image x="560" y="220" width="46" height="46" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/><text x="620" y="248" font-family="Arial, sans-serif" font-size="26" fill="#173f35"><tspan x="620" dy="0">Container Apps API</tspan></text><text x="562" y="305" font-family="Arial, sans-serif" font-size="23" fill="#173f35"><tspan x="562" dy="0">Permissions + workflow</tspan><tspan x="562" dy="28.75">Five bounded assistants</tspan></text><path d="M1070,285 l65,0" fill="none" stroke="#173f35" stroke-width="3" marker-end="url(#arrow)"/><rect x="1145" y="198" width="391" height="195" rx="12" fill="#e8f2fb" stroke="#173f35" stroke-width="2"/><image x="1165" y="220" width="46" height="46" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/><text x="1225" y="248" font-family="Arial, sans-serif" font-size="26" fill="#173f35"><tspan x="1225" dy="0">SQL state</tspan></text><text x="1167" y="305" font-family="Arial, sans-serif" font-size="23" fill="#173f35"><tspan x="1167" dy="0">Cases, proposals, audit</tspan><tspan x="1167" dy="28.75">Version-bound review</tspan></text><rect x="64" y="480" width="390" height="235" rx="12" fill="#e8f2fb" stroke="#173f35" stroke-width="2"/><image x="84" y="502" width="46" height="46" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/><text x="144" y="530" font-family="Arial, sans-serif" font-size="26" fill="#173f35"><tspan x="144" dy="0">Entra sign-in</tspan></text><text x="86" y="587" font-family="Arial, sans-serif" font-size="23" fill="#173f35"><tspan x="86" dy="0">EasyAuth identity</tspan><tspan x="86" dy="28.75">API rechecks role + scope</tspan><tspan x="86" dy="28.75">Identity is not delegation.</tspan></text><path d="M454,565 l86,-180" fill="none" stroke="#173f35" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="10 7"/><rect x="540" y="480" width="520" height="235" rx="12" fill="#f0ebfa" stroke="#173f35" stroke-width="2"/><image x="560" y="502" width="46" height="46" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/><text x="620" y="530" font-family="Arial, sans-serif" font-size="26" fill="#173f35"><tspan x="620" dy="0">Scoped model call</tspan></text><text x="562" y="587" font-family="Arial, sans-serif" font-size="23" fill="#173f35"><tspan x="562" dy="0">Azure OpenAI: draft + usage</tspan><tspan x="562" dy="28.75">Decision 1: gated candidate path</tspan><tspan x="562" dy="28.75">Validate before storing proposal</tspan></text><path d="M800,405 l0,62" fill="none" stroke="#173f35" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="10 7"/><rect x="1145" y="480" width="391" height="235" rx="12" fill="#e8f2fb" stroke="#173f35" stroke-width="2"/><image x="1165" y="502" width="46" height="46" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/><text x="1225" y="530" font-family="Arial, sans-serif" font-size="26" fill="#173f35"><tspan x="1225" dy="0">Evidence files</tspan></text><text x="1167" y="587" font-family="Arial, sans-serif" font-size="23" fill="#173f35"><tspan x="1167" dy="0">Azure Blob bytes</tspan><tspan x="1167" dy="28.75">SQL references + hashes</tspan><tspan x="1167" dy="28.75">Restore proof is separate.</tspan></text><path d="M1065,405 l70,65" fill="none" stroke="#173f35" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="10 7"/><text x="64" y="837" font-family="Arial, sans-serif" font-size="20" fill="#50655e"><tspan x="64" dy="0">Solid = application/state relationship | Dashed = configured or gated path, not fresh deployment proof</tspan></text><text x="64" y="869" font-family="Arial, sans-serif" font-size="17" fill="#50655e"><tspan x="64" dy="0">SOURCE-BASED EXERCISE VIEW | 23 OCT 2026 | NOT LIVE INVENTORY</tspan></text></svg>
