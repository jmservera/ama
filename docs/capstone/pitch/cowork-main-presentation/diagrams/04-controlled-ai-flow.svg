<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#173f35"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="12" fill="#faf9f6" stroke="#faf9f6" stroke-width="2"/><text x="64" y="79" font-family="Arial, sans-serif" font-size="37" fill="#173f35"><tspan x="64" dy="0">The model prepares. The system checks. A person decides.</tspan></text><text x="64" y="123" font-family="Arial, sans-serif" font-size="21" fill="#50655e"><tspan x="64" dy="0">A guarded request/response flow, not an autonomous agent-to-agent conversation.</tspan></text><rect x="64" y="245" width="344" height="300" rx="12" fill="#e8f1ed" stroke="#173f35" stroke-width="2"/><text x="86" y="295" font-family="Arial, sans-serif" font-size="26" fill="#173f35"><tspan x="86" dy="0">1. Capture</tspan></text><text x="86" y="352" font-family="Arial, sans-serif" font-size="23" fill="#173f35"><tspan x="86" dy="0">Role + case scope</tspan><tspan x="86" dy="28.75">Permitted evidence</tspan><tspan x="86" dy="28.75">Source/version IDs</tspan></text><rect x="440" y="245" width="344" height="300" rx="12" fill="#f0ebfa" stroke="#173f35" stroke-width="2"/><text x="462" y="295" font-family="Arial, sans-serif" font-size="26" fill="#173f35"><tspan x="462" dy="0">2. Call</tspan></text><text x="462" y="352" font-family="Arial, sans-serif" font-size="23" fill="#173f35"><tspan x="462" dy="0">Bounded task</tspan><tspan x="462" dy="28.75">Model + usage</tspan><tspan x="462" dy="28.75">No database lock</tspan></text><rect x="816" y="245" width="344" height="300" rx="12" fill="#e8f2fb" stroke="#173f35" stroke-width="2"/><text x="838" y="295" font-family="Arial, sans-serif" font-size="26" fill="#173f35"><tspan x="838" dy="0">3. Validate</tspan></text><text x="838" y="352" font-family="Arial, sans-serif" font-size="23" fill="#173f35"><tspan x="838" dy="0">Schema + citations</tspan><tspan x="838" dy="28.75">Stale/error = stop</tspan><tspan x="838" dy="28.75">Store as unreviewed</tspan></text><rect x="1192" y="245" width="344" height="300" rx="12" fill="#e8f1ed" stroke="#173f35" stroke-width="2"/><text x="1214" y="295" font-family="Arial, sans-serif" font-size="26" fill="#173f35"><tspan x="1214" dy="0">4. Review</tspan></text><text x="1214" y="352" font-family="Arial, sans-serif" font-size="23" fill="#173f35"><tspan x="1214" dy="0">Human checks source</tspan><tspan x="1214" dy="28.75">Current permissions</tspan><tspan x="1214" dy="28.75">Separate domain action</tspan></text><path d="M410,385 l20,0" fill="none" stroke="#173f35" stroke-width="3" marker-end="url(#arrow)"/><path d="M786,385 l20,0" fill="none" stroke="#173f35" stroke-width="3" marker-end="url(#arrow)"/><path d="M1162,385 l20,0" fill="none" stroke="#173f35" stroke-width="3" marker-end="url(#arrow)"/><rect x="64" y="628" width="1472" height="135" rx="12" fill="#fff1d6" stroke="#173f35" stroke-width="2"/><text x="86" y="678" font-family="Arial, sans-serif" font-size="26" fill="#173f35"><tspan x="86" dy="0">Failure does not become approval</tspan></text><text x="86" y="735" font-family="Arial, sans-serif" font-size="23" fill="#173f35"><tspan x="86" dy="0">Unknown, stale, disabled, exhausted allowance or unavailable model -&gt; owned manual work; hazards bypass AI.</tspan></text><text x="64" y="837" font-family="Arial, sans-serif" font-size="20" fill="#50655e"><tspan x="64" dy="0">Citation presence is not semantic truth | Proposal review never substitutes for consent, QA or Finance</tspan></text><text x="64" y="869" font-family="Arial, sans-serif" font-size="17" fill="#50655e"><tspan x="64" dy="0">SOURCE-BASED EXERCISE VIEW | 23 OCT 2026 | NOT LIVE INVENTORY</tspan></text></svg>
