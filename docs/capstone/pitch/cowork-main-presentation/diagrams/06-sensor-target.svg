<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#173f35"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="12" fill="#faf9f6" stroke="#faf9f6" stroke-width="2"/><text x="64" y="79" font-family="Arial, sans-serif" font-size="37" fill="#173f35"><tspan x="64" dy="0">Sensors raise a review signal, never a safety verdict.</tspan></text><text x="64" y="123" font-family="Arial, sans-serif" font-size="21" fill="#50655e"><tspan x="64" dy="0">Accepted design direction, not a completed live telemetry path. Every dashed step needs its own evidence.</tspan></text><rect x="64" y="250" width="344" height="310" rx="12" fill="#fff1d6" stroke="#173f35" stroke-width="2" stroke-dasharray="10 7"/><text x="86" y="300" font-family="Arial, sans-serif" font-size="26" fill="#173f35"><tspan x="86" dy="0">Device / simulator</tspan></text><text x="86" y="357" font-family="Arial, sans-serif" font-size="23" fill="#173f35"><tspan x="86" dy="0">Distinct identity</tspan><tspan x="86" dy="28.75">Label synthetic input</tspan><tspan x="86" dy="28.75">Stable reading ID</tspan></text><rect x="440" y="250" width="344" height="310" rx="12" fill="#fff1d6" stroke="#173f35" stroke-width="2" stroke-dasharray="10 7"/><image x="460" y="272" width="46" height="46" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/><text x="520" y="300" font-family="Arial, sans-serif" font-size="26" fill="#173f35"><tspan x="520" dy="0">Azure IoT Hub</tspan></text><text x="462" y="357" font-family="Arial, sans-serif" font-size="23" fill="#173f35"><tspan x="462" dy="0">Basic for exercise</tspan><tspan x="462" dy="28.75">Device-to-cloud only</tspan><tspan x="462" dy="28.75">Credential owner needed</tspan></text><rect x="816" y="250" width="344" height="310" rx="12" fill="#fff1d6" stroke="#173f35" stroke-width="2" stroke-dasharray="10 7"/><image x="836" y="272" width="46" height="46" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/><text x="896" y="300" font-family="Arial, sans-serif" font-size="26" fill="#173f35"><tspan x="896" dy="0">API + SQL</tspan></text><text x="838" y="357" font-family="Arial, sans-serif" font-size="23" fill="#173f35"><tspan x="838" dy="0">Validate mapping/time</tspan><tspan x="838" dy="28.75">Idempotent append</tspan><tspan x="838" dy="28.75">Owned DQ exceptions</tspan></text><rect x="1192" y="250" width="344" height="310" rx="12" fill="#fff1d6" stroke="#173f35" stroke-width="2" stroke-dasharray="10 7"/><text x="1214" y="300" font-family="Arial, sans-serif" font-size="26" fill="#173f35"><tspan x="1214" dy="0">Human review</tspan></text><text x="1214" y="357" font-family="Arial, sans-serif" font-size="23" fill="#173f35"><tspan x="1214" dy="0">Deterministic signal</tspan><tspan x="1214" dy="28.75">No diagnosis / repriority</tspan><tspan x="1214" dy="28.75">Missing = insufficient</tspan></text><path d="M410,405 l20,0" fill="none" stroke="#173f35" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="10 7"/><path d="M786,405 l20,0" fill="none" stroke="#173f35" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="10 7"/><path d="M1162,405 l20,0" fill="none" stroke="#173f35" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="10 7"/><rect x="64" y="635" width="1472" height="130" rx="12" fill="#e8f1ed" stroke="#173f35" stroke-width="2"/><text x="86" y="685" font-family="Arial, sans-serif" font-size="26" fill="#173f35"><tspan x="86" dy="0">Independent safety route</tspan></text><text x="86" y="742" font-family="Arial, sans-serif" font-size="23" fill="#173f35"><tspan x="86" dy="0">A resident report goes directly to human hazard handling. Telemetry and AI never delay or suppress it.</tspan></text><text x="64" y="837" font-family="Arial, sans-serif" font-size="20" fill="#50655e"><tspan x="64" dy="0">Local offline consumer evidence != live Hub/SQL/Azure acceptance | Dashed = target, not live transport</tspan></text><text x="64" y="869" font-family="Arial, sans-serif" font-size="17" fill="#50655e"><tspan x="64" dy="0">SOURCE-BASED EXERCISE VIEW | 23 OCT 2026 | NOT LIVE INVENTORY</tspan></text></svg>
