<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#173f35"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="12" fill="#faf9f6" stroke="#faf9f6" stroke-width="2"/><text x="64" y="79" font-family="Arial, sans-serif" font-size="37" fill="#173f35"><tspan x="64" dy="0">One programme. One evidence trail. People decide.</tspan></text><text x="64" y="123" font-family="Arial, sans-serif" font-size="21" fill="#50655e"><tspan x="64" dy="0">Start here: this is an operating-model view, not a network boundary.</tspan></text><rect x="64" y="240" width="340" height="310" rx="12" fill="#e8f1ed" stroke="#173f35" stroke-width="2"/><text x="86" y="290" font-family="Arial, sans-serif" font-size="26" fill="#173f35"><tspan x="86" dy="0">People</tspan></text><text x="86" y="347" font-family="Arial, sans-serif" font-size="23" fill="#173f35"><tspan x="86" dy="0">Residents choose.</tspan><tspan x="86" dy="28.75">Staff own the case.</tspan><tspan x="86" dy="28.75">Professionals approve.</tspan></text><path d="M410,390 l70,0" fill="none" stroke="#173f35" stroke-width="3" marker-end="url(#arrow)"/><rect x="490" y="240" width="555" height="310" rx="12" fill="#e8f1ed" stroke="#173f35" stroke-width="2"/><image x="510" y="262" width="46" height="46" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/><text x="570" y="290" font-family="Arial, sans-serif" font-size="26" fill="#173f35"><tspan x="570" dy="0">Controlled workbench</tspan></text><text x="512" y="347" font-family="Arial, sans-serif" font-size="23" fill="#173f35"><tspan x="512" dy="0">Workflow keeps the commitments.</tspan><tspan x="512" dy="28.75">Rules enforce the boundaries.</tspan><tspan x="512" dy="28.75">AI prepares source-bound help.</tspan></text><path d="M1055,390 l70,0" fill="none" stroke="#173f35" stroke-width="3" marker-end="url(#arrow)"/><rect x="1136" y="240" width="400" height="310" rx="12" fill="#e8f2fb" stroke="#173f35" stroke-width="2"/><image x="1156" y="262" width="46" height="46" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/><text x="1216" y="290" font-family="Arial, sans-serif" font-size="26" fill="#173f35"><tspan x="1216" dy="0">Retained evidence</tspan></text><text x="1158" y="347" font-family="Arial, sans-serif" font-size="23" fill="#173f35"><tspan x="1158" dy="0">Azure SQL: case + audit</tspan><tspan x="1158" dy="28.75">Blob: evidence files</tspan><tspan x="1158" dy="28.75">Unknown stays unknown.</tspan></text><rect x="490" y="610" width="1046" height="145" rx="12" fill="#f0ebfa" stroke="#173f35" stroke-width="2"/><image x="510" y="632" width="46" height="46" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/><text x="570" y="660" font-family="Arial, sans-serif" font-size="26" fill="#173f35"><tspan x="570" dy="0">Bounded AI, never delegated accountability</tspan></text><text x="512" y="717" font-family="Arial, sans-serif" font-size="23" fill="#173f35"><tspan x="512" dy="0">Generative drafts and typed decisions enter a review queue, not an approval.</tspan></text><text x="64" y="837" font-family="Arial, sans-serif" font-size="20" fill="#50655e"><tspan x="64" dy="0">Solid = logical workflow | AI output is unreviewed | Value remains a measured hypothesis</tspan></text><text x="64" y="869" font-family="Arial, sans-serif" font-size="17" fill="#50655e"><tspan x="64" dy="0">SOURCE-BASED EXERCISE VIEW | 23 OCT 2026 | NOT LIVE INVENTORY</tspan></text></svg>
