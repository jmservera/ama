<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#173f35"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="12" fill="#faf9f6" stroke="#faf9f6" stroke-width="2"/><text x="64" y="79" font-family="Arial, sans-serif" font-size="37" fill="#173f35"><tspan x="64" dy="0">Design for failure before asking for operational trust.</tspan></text><text x="64" y="123" font-family="Arial, sans-serif" font-size="21" fill="#50655e"><tspan x="64" dy="0">Configured/source architecture. No claim of tested whole-system recovery or production readiness.</tspan></text><rect x="64" y="200" width="460" height="245" rx="12" fill="#e8f2fb" stroke="#173f35" stroke-width="2"/><image x="84" y="222" width="46" height="46" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/><text x="144" y="250" font-family="Arial, sans-serif" font-size="26" fill="#173f35"><tspan x="144" dy="0">Access + secrets</tspan></text><text x="86" y="307" font-family="Arial, sans-serif" font-size="23" fill="#173f35"><tspan x="86" dy="0">Entra and managed identities</tspan><tspan x="86" dy="28.75">Key Vault secret references</tspan><tspan x="86" dy="28.75">Private backing services</tspan></text><rect x="570" y="200" width="460" height="245" rx="12" fill="#e8f1ed" stroke="#173f35" stroke-width="2"/><image x="590" y="222" width="46" height="46" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/><text x="650" y="250" font-family="Arial, sans-serif" font-size="26" fill="#173f35"><tspan x="650" dy="0">Runtime + releases</tspan></text><text x="592" y="307" font-family="Arial, sans-serif" font-size="23" fill="#173f35"><tspan x="592" dy="0">Container Apps / pinned images</tspan><tspan x="592" dy="28.75">Registry and CI checks</tspan><tspan x="592" dy="28.75">Controlled rollout + rollback</tspan></text><rect x="1076" y="200" width="460" height="245" rx="12" fill="#e8f2fb" stroke="#173f35" stroke-width="2"/><image x="1096" y="222" width="46" height="46" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/><text x="1156" y="250" font-family="Arial, sans-serif" font-size="26" fill="#173f35"><tspan x="1156" dy="0">Observe + budget</tspan></text><text x="1098" y="307" font-family="Arial, sans-serif" font-size="23" fill="#173f35"><tspan x="1098" dy="0">Monitor / Log Analytics</tspan><tspan x="1098" dy="28.75">Scoped allowance + usage</tspan><tspan x="1098" dy="28.75">Budget alert is not a stop.</tspan></text><rect x="64" y="520" width="1472" height="250" rx="12" fill="#fff1d6" stroke="#173f35" stroke-width="2"/><text x="86" y="570" font-family="Arial, sans-serif" font-size="26" fill="#173f35"><tspan x="86" dy="0">Evidence required before expansion</tspan></text><text x="86" y="627" font-family="Arial, sans-serif" font-size="23" fill="#173f35"><tspan x="86" dy="0">Genuine staff sign-in + role denial | Azure SQL persistence | Bounded real-model result</tspan><tspan x="86" dy="28.75">Restore and recovery drill | Human task/comprehension checks | Current cost + processing terms</tspan><tspan x="86" dy="28.75">Keep manual and safety routes independent; do not relax private controls to rescue a demo.</tspan></text><text x="64" y="837" font-family="Arial, sans-serif" font-size="20" fill="#50655e"><tspan x="64" dy="0">Detailed network settings belong in the runbook | No live endpoints, credentials or private roster in this pack</tspan></text><text x="64" y="869" font-family="Arial, sans-serif" font-size="17" fill="#50655e"><tspan x="64" dy="0">SOURCE-BASED EXERCISE VIEW | 23 OCT 2026 | NOT LIVE INVENTORY</tspan></text></svg>
