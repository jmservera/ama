<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#173f35"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="12" fill="#faf9f6" stroke="#faf9f6" stroke-width="2"/><text x="64" y="79" font-family="Arial, sans-serif" font-size="37" fill="#173f35"><tspan x="64" dy="0">Count accepted outcomes above a quality floor.</tspan></text><text x="64" y="123" font-family="Arial, sans-serif" font-size="21" fill="#50655e"><tspan x="64" dy="0">Tokenomics: measured usage is one input. No price or accepted-outcome unit cost is established.</tspan></text><rect x="64" y="215" width="460" height="305" rx="12" fill="#f0ebfa" stroke="#173f35" stroke-width="2"/><image x="84" y="237" width="46" height="46" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/><text x="144" y="265" font-family="Arial, sans-serif" font-size="26" fill="#173f35"><tspan x="144" dy="0">Observe</tspan></text><text x="86" y="322" font-family="Arial, sans-serif" font-size="23" fill="#173f35"><tspan x="86" dy="0">6,884 tokens / five runs</tspan><tspan x="86" dy="28.75">Historical operator exercise</tspan><tspan x="86" dy="28.75">No human acceptance</tspan></text><path d="M535,365 l25,0" fill="none" stroke="#173f35" stroke-width="3" marker-end="url(#arrow)"/><rect x="570" y="215" width="460" height="305" rx="12" fill="#e8f2fb" stroke="#173f35" stroke-width="2"/><image x="590" y="237" width="46" height="46" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/><text x="650" y="265" font-family="Arial, sans-serif" font-size="26" fill="#173f35"><tspan x="650" dy="0">Account for total cost</tspan></text><text x="592" y="322" font-family="Arial, sans-serif" font-size="23" fill="#173f35"><tspan x="592" dy="0">Inference + hosting allocation</tspan><tspan x="592" dy="28.75">Human review + correction</tspan><tspan x="592" dy="28.75">Assurance + support</tspan></text><path d="M1040,365 l25,0" fill="none" stroke="#173f35" stroke-width="3" marker-end="url(#arrow)"/><rect x="1076" y="215" width="460" height="305" rx="12" fill="#fff1d6" stroke="#173f35" stroke-width="2"/><text x="1098" y="265" font-family="Arial, sans-serif" font-size="26" fill="#173f35"><tspan x="1098" dy="0">Divide by accepted work</tspan></text><text x="1098" y="322" font-family="Arial, sans-serif" font-size="23" fill="#173f35"><tspan x="1098" dy="0">Agreed quality floor</tspan><tspan x="1098" dy="28.75">Accepted-proposal count</tspan><tspan x="1098" dy="28.75">Current unit cost: unknown</tspan></text><rect x="64" y="610" width="712" height="155" rx="12" fill="#e8f1ed" stroke="#173f35" stroke-width="2"/><text x="86" y="660" font-family="Arial, sans-serif" font-size="26" fill="#173f35"><tspan x="86" dy="0">Existing bounded path</tspan></text><text x="86" y="717" font-family="Arial, sans-serif" font-size="23" fill="#173f35"><tspan x="86" dy="0">Finite calls / tokens / expiry</tspan><tspan x="86" dy="28.75">Partial usage capture; not a money cap.</tspan></text><rect x="808" y="610" width="728" height="155" rx="12" fill="#fff1d6" stroke="#173f35" stroke-width="2" stroke-dasharray="10 7"/><text x="830" y="660" font-family="Arial, sans-serif" font-size="26" fill="#173f35"><tspan x="830" dy="0">Proposed, not tested</tspan></text><text x="830" y="717" font-family="Arial, sans-serif" font-size="23" fill="#173f35"><tspan x="830" dy="0">Complete metering + currency/task budgets</tspan><tspan x="830" dy="28.75">Per-request call and depth limits.</tspan></text><text x="64" y="837" font-family="Arial, sans-serif" font-size="20" fill="#50655e"><tspan x="64" dy="0">No savings, payback or currency/unit claim | Keep or revert one measured lever | Source: E19</tspan></text><text x="64" y="869" font-family="Arial, sans-serif" font-size="17" fill="#50655e"><tspan x="64" dy="0">SOURCE-BASED EXERCISE VIEW | 23 OCT 2026 | NOT LIVE INVENTORY</tspan></text></svg>
