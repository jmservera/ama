<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#173f35"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="12" fill="#faf9f6" stroke="#faf9f6" stroke-width="2"/><text x="64" y="79" font-family="Arial, sans-serif" font-size="37" fill="#173f35"><tspan x="64" dy="0">Choose the smallest tool that earns its place.</tspan></text><text x="64" y="123" font-family="Arial, sans-serif" font-size="21" fill="#50655e"><tspan x="64" dy="0">Task routing is application policy. Decision 1 is not the deterministic workflow engine.</tspan></text><rect x="64" y="220" width="468" height="320" rx="12" fill="#e8f1ed" stroke="#173f35" stroke-width="2"/><image x="84" y="242" width="46" height="46" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/><text x="144" y="270" font-family="Arial, sans-serif" font-size="26" fill="#173f35"><tspan x="144" dy="0">Rules / no AI</tspan></text><text x="86" y="327" font-family="Arial, sans-serif" font-size="23" fill="#173f35"><tspan x="86" dy="0">Known policy + arithmetic</tspan><tspan x="86" dy="28.75">Eligibility and freshness</tspan><tspan x="86" dy="28.75">Consent / release gates</tspan></text><rect x="566" y="220" width="468" height="320" rx="12" fill="#e8f2fb" stroke="#173f35" stroke-width="2"/><text x="588" y="270" font-family="Arial, sans-serif" font-size="26" fill="#173f35"><tspan x="588" dy="0">Decision model</tspan></text><text x="588" y="327" font-family="Arial, sans-serif" font-size="23" fill="#173f35"><tspan x="588" dy="0">Supplied candidate scoring</tspan><tspan x="588" dy="28.75">Form / support screening</tspan><tspan x="588" dy="28.75">Abstain when uncertain</tspan></text><rect x="1068" y="220" width="468" height="320" rx="12" fill="#f0ebfa" stroke="#173f35" stroke-width="2"/><image x="1088" y="242" width="46" height="46" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/><text x="1148" y="270" font-family="Arial, sans-serif" font-size="26" fill="#173f35"><tspan x="1148" dy="0">Generative AI</tspan></text><text x="1090" y="327" font-family="Arial, sans-serif" font-size="23" fill="#173f35"><tspan x="1090" dy="0">Explain permitted evidence</tspan><tspan x="1090" dy="28.75">Draft a cited narrative</tspan><tspan x="1090" dy="28.75">Human verifies meaning</tspan></text><path d="M298,553 l0,65" fill="none" stroke="#173f35" stroke-width="3" marker-end="url(#arrow)"/><path d="M800,553 l0,65" fill="none" stroke="#173f35" stroke-width="3" marker-end="url(#arrow)"/><path d="M1302,553 l0,65" fill="none" stroke="#173f35" stroke-width="3" marker-end="url(#arrow)"/><rect x="64" y="635" width="1472" height="135" rx="12" fill="#e8f1ed" stroke="#173f35" stroke-width="2"/><text x="86" y="685" font-family="Arial, sans-serif" font-size="26" fill="#173f35"><tspan x="86" dy="0">One shared boundary: a proposal is not permission</tspan></text><text x="86" y="742" font-family="Arial, sans-serif" font-size="23" fill="#173f35"><tspan x="86" dy="0">Review current evidence and authority. Retain a manual route. Count review effort, latency and full cost.</tspan></text><text x="64" y="837" font-family="Arial, sans-serif" font-size="20" fill="#50655e"><tspan x="64" dy="0">Decision-model cost/latency advantage is a hypothesis until paired tests pass | Sources: E04, E05</tspan></text><text x="64" y="869" font-family="Arial, sans-serif" font-size="17" fill="#50655e"><tspan x="64" dy="0">SOURCE-BASED EXERCISE VIEW | 23 OCT 2026 | NOT LIVE INVENTORY</tspan></text></svg>
