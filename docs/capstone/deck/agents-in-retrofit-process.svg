<text x="60" y="85.0" fill="#183A31" font-family="Liberation Sans, Arial, sans-serif" font-size="55" font-weight="700" dominant-baseline="text-before-edge" text-anchor="start">Five assists. One controlled journey.</text>
<text x="60" y="155.0" fill="#183A31" font-family="Liberation Sans, Arial, sans-serif" font-size="27" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">The workflow owns progression. People own decisions.</text>
