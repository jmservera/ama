[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zava-forward-import"
dynamic = ["version"]
description = "Zava Forward quarantining document import workload"
requires-python = ">=3.12"
dependencies = ["zava-forward-core[blob]>=0.1.0,<0.2"]

[project.optional-dependencies]
dev = ["ruff==0.17.1", "mypy==2.4.0"]

[tool.setuptools.dynamic]
version = { attr = "zava_forward.importer.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
mypy_path = ["src"]
explicit_package_bases = true
namespace_packages = true
files = ["src", "tests"]

# Moved unchanged from mvp/ (ADR 0006 move-not-copy); formatting and typing follow after the migration.
[tool.ruff.format]
exclude = ["tests/test_document_form_fixtures.py"]

[tool.ruff.lint.per-file-ignores]
"tests/test_document_form_fixtures.py" = ["E501", "E701", "E702", "E741", "I001", "UP", "B", "F841"]

[[tool.mypy.overrides]]
module = ["test_document_form_fixtures", "tests.test_document_form_fixtures"]
ignore_errors = true
