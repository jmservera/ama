[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zava-forward-api"
dynamic = ["version"]
description = "Zava Forward HTTP API and web workbench"
requires-python = ">=3.12"
dependencies = [
    "zava-forward-core[sql]>=0.1.0,<0.2",
    "zava-forward-agents>=0.1.0,<0.2",
]

[project.optional-dependencies]
dev = ["ruff==0.17.1", "mypy==2.4.0"]

[tool.setuptools.dynamic]
version = { attr = "zava_forward.api.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# Moved unchanged from mvp/tests in M2 of #199; exemptions end in M6.
[tool.ruff.lint.per-file-ignores]
"tests/test_content_standard.py" = ["E501"]

[tool.ruff.format]
exclude = ["tests/test_content_standard.py"]

[tool.mypy]
strict = true
mypy_path = ["src"]
explicit_package_bases = true
namespace_packages = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tests.test_content_standard", "test_content_standard", "zava_forward.core.*"]
ignore_errors = true
follow_imports = "skip"
