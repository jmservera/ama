[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zava-forward-api"
dynamic = ["version"]
description = "Zava Forward HTTP API and web workbench"
requires-python = ">=3.12"
dependencies = [
    "zava-forward-core[sql,blob]>=0.1.0,<0.2",
    "zava-forward-agents>=0.1.0,<0.2",
]

[project.optional-dependencies]
dev = ["ruff==0.17.1", "mypy==2.4.0", "playwright==1.64.0"]

[tool.setuptools.dynamic]
version = { attr = "zava_forward.api.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# Moved unchanged from mvp/ in M2 and M5 of #199; exemptions are a follow-up to #199 (see src/README.md).
[tool.ruff.lint.per-file-ignores]
"tests/test_content_standard.py" = ["E501"]
# Builds on the untyped role-matrix harness; line length and import order follow its conventions.
"tests/test_chat_panel.py" = ["E501", "I001"]
"src/zava_forward/api/{server,auth,timecapture}.py" = ["E501", "E701", "E702", "E741", "I001", "UP", "B", "F841", "F401", "E731", "F541", "F811"]
"tests/{test_accessibility_baseline,test_ai_tasks,test_assistant_release,test_assistants,test_assistants_dispatch,test_auth,test_chat_fixture_roles,test_chat_isolation,test_continuity,test_design_system,test_document_controls,test_lawstore,test_ledger,test_mssqlstore,test_mvp,test_ranking_policy,test_ranking_scale,test_role_endpoint_inventory,test_role_matrix,test_timecapture,test_ui_support,test_workflows}.py" = ["E501", "E701", "E702", "E741", "I001", "UP", "B", "F841", "F401", "E731", "F541", "F811"]
"checks/*.py" = ["E501", "E701", "E702", "E741", "I001", "UP", "B", "F841", "F401", "E731", "F541", "F811"]

[tool.ruff.format]
exclude = [
  "tests/test_content_standard.py",
  "src/zava_forward/api/{server,auth,timecapture}.py",
  "tests/{test_accessibility_baseline,test_ai_tasks,test_assistant_release,test_assistants,test_assistants_dispatch,test_auth,test_chat_fixture_roles,test_chat_isolation,test_continuity,test_design_system,test_document_controls,test_lawstore,test_ledger,test_mssqlstore,test_mvp,test_ranking_policy,test_ranking_scale,test_role_endpoint_inventory,test_role_matrix,test_timecapture,test_ui_support,test_workflows}.py",
  "checks/*.py",
]

[tool.mypy]
strict = true
mypy_path = ["src", "tests", "../core/src", "../core/tests"]
explicit_package_bases = true
namespace_packages = true
files = ["src", "tests", "checks"]

[[tool.mypy.overrides]]
module = [
  "tests.test_content_standard", "test_content_standard", "zava_forward.core.*", "zava_forward.agents.*",
  "zava_forward.api.server", "zava_forward.api.auth", "zava_forward.api.timecapture", "test_accessibility_baseline", "test_ai_tasks", "test_assistant_release", "test_assistants", "test_assistants_dispatch", "tests.test_assistants_dispatch", "test_auth", "test_chat_fixture_roles", "test_chat_isolation", "test_chat_panel", "tests.test_chat_panel", "test_continuity", "test_design_system", "test_document_controls", "test_lawstore", "test_ledger", "test_mssqlstore", "test_mvp", "test_ranking_policy", "test_ranking_scale", "test_role_endpoint_inventory", "test_role_matrix", "test_timecapture", "test_ui_support", "test_workflows", "tests.test_accessibility_baseline", "tests.test_ai_tasks", "tests.test_assistant_release", "tests.test_assistants", "tests.test_auth", "tests.test_chat_fixture_roles", "tests.test_chat_isolation", "tests.test_continuity", "tests.test_design_system", "tests.test_document_controls", "tests.test_lawstore", "tests.test_ledger", "tests.test_mssqlstore", "tests.test_mvp", "tests.test_ranking_policy", "tests.test_ranking_scale", "tests.test_role_endpoint_inventory", "tests.test_role_matrix", "tests.test_timecapture", "tests.test_ui_support", "tests.test_workflows", "assistants_browser_check", "browser_check", "checks.assistants_browser_check", "checks.browser_check",
]
ignore_errors = true
follow_imports = "skip"

# Typed continuity tests reuse the existing untyped assistant and Store fixtures.
[[tool.mypy.overrides]]
module = ["test_continuity_epoch_export", "tests.test_continuity_epoch_export",
          "test_operator_suspension", "tests.test_operator_suspension"]
disallow_untyped_calls = false

[tool.setuptools.package-data]
"zava_forward.api" = ["web/*", "web/vendor/*", "web/vendor/images/*"]
"zava_forward.api.resident_preview" = ["web/*"]
"zava_forward.api.resident_demo" = ["web/*"]

[[tool.mypy.overrides]]
module = ["test_progress_report_api", "tests.test_progress_report_api"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["test_progress_reports"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["test_coordinator"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["test_coordinator_api", "tests.test_coordinator_api"]
disallow_untyped_calls = false

# Keep the new HTTP harness typed while calling the migrated Store/server boundary.
[[tool.mypy.overrides]]
module = ["test_stock_reconciliation_api", "tests.test_stock_reconciliation_api",
          "test_handoff_api", "tests.test_handoff_api", "test_hazard_api", "tests.test_hazard_api",
          "test_resident_api", "tests.test_resident_api"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["test_form_staging_api", "tests.test_form_staging_api",
          "test_finance_match_api", "tests.test_finance_match_api"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["test_form_staging"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["test_rule_alerts", "tests.test_rule_alerts",
          "test_regulatory_chat_api", "tests.test_regulatory_chat_api",
          "test_task_queue_api", "tests.test_task_queue_api"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["test_rule_engine"]
follow_imports = "skip"
ignore_missing_imports = true
# Runtime PYTHONPATH supplies the shared fixture, strictly checked by the core project.
[[tool.mypy.overrides]]
module = ["building_fixture", "dataset", "regulatory_fixture", "test_finance_signoffs",
          "test_grant_lifecycle_controls"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["test_bulk_edit_api", "tests.test_bulk_edit_api",
          "test_governance_evidence_api", "tests.test_governance_evidence_api",
          "provenance_browser_check", "checks.provenance_browser_check"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["sensor_consumer_fixture", "test_sensor_consumer"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["test_sensor_ingestion", "tests.test_sensor_ingestion"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["zava_forward.core.sensor_consumer"]
follow_imports = "normal"
ignore_errors = false
disallow_untyped_calls = false

# Core owns these existing untyped fixture checks; the shared sensor suite is typed here.
[[tool.mypy.overrides]]
module = ["dataset", "release_support", "test_finance_signoffs", "test_grant_lifecycle_controls"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["test_chatthreads", "test_coordinator", "test_documents", "test_progress_reports",
          "test_quality_procurement", "test_sqlqueues", "test_sqlreads", "test_sqlstore",
          "test_stock_reconciliation"]
follow_imports = "skip"
