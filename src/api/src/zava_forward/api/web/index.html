<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zava Forward | Zava North Homes</title>
<link rel="stylesheet" href="/vendor/leaflet.css">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/progress.css">
</head>
<body data-auth-provider="__AUTH_PROVIDER__">
<a class="skip-link" href="#app">Skip to main content</a>
<section id="startup" class="card startup" aria-label="Workspace startup">
  <h1>Starting the workspace</h1>
  <p id="startup-status" role="status" aria-live="polite" aria-atomic="true">Starting the workspace, this can take up to a minute when the service has been idle.</p>
  <button id="startup-retry" type="button" hidden>Try again</button>
  <noscript><p>JavaScript is required for case work. Enable JavaScript and reload this page, or contact application support.</p></noscript>
</section>
<script src="/workspace-shell.js"></script>
<header class="top">
  <a class="brand" href="/app" id="home"><img class="zava-logo" src="/zava-logo.png" alt="Zava North Homes"><span>Zava Forward<small>Zava North Homes</small></span></a>
  <nav id="nav" aria-label="Workbench" hidden></nav>
  <button id="employee-chat-launcher" type="button" class="alt" aria-haspopup="dialog" hidden>Ask the assistant</button>
  <details id="account" class="account" hidden>
    <summary aria-label="Your account">
      <span class="avatar"><img id="account-photo" alt="" hidden><span id="account-initials" aria-hidden="true"></span></span>
      <span id="account-short">Account</span>
    </summary>
    <div class="account-panel">
      <strong id="account-name"></strong>
      <p id="account-email" class="muted"></p>
      <p id="who" class="muted"></p>
      <p id="photo-status" class="muted" role="status"></p>
      <p id="account-error" class="err" role="alert"></p>
      <button id="switch-account" class="alt" type="button">Use another account</button>
      <button id="signout" type="button">Sign out</button>
    </div>
  </details>
</header>
<p id="workspace-status" class="workspace-status" role="status" aria-live="polite" aria-atomic="true"></p>
<div id="action-status" class="workspace-status"></div>
<main id="app" tabindex="-1"></main>
<script src="/async-action.js"></script>
<script src="/vendor/leaflet.js"></script>
<script src="/panels.js"></script>
<script src="/ops.js"></script>
<script src="/assistants.js"></script>
<script src="/chat.js"></script>
<script src="/timecapture.js"></script>
<script src="/role-screens.js"></script>
<script src="/case-workspace.js"></script>
<script src="/progress.js"></script>
<script src="/app.js"></script>
</body>
</html>
