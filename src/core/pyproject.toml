[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zava-forward-core"
dynamic = ["version"]
description = "Zava Forward shared domain, data access and rules library"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
sql = ["mssql-python==1.15.0"]
blob = ["azure-storage-blob==12.31.0"]
dev = ["ruff==0.17.1", "mypy==2.4.0"]

[tool.setuptools.dynamic]
version = { attr = "zava_forward.core.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
mypy_path = ["src", "tests"]
explicit_package_bases = true
namespace_packages = true
files = ["src", "tests"]

# Modules moved unchanged from mvp/ (ADR 0006 move-not-copy). Formatting and typing follow after
# the migration so the renames stay pure and git history follows the files.
[tool.ruff.format]
exclude = [
  "src/zava_forward/core/synthetic/{loadcheck,scale_fixture,sensor_backfill}.py",
  "src/zava_forward/core/{ai,ai_registry,ai_tasks,assistant_release,assistants,chat_isolation,chat_privacy,chatthreads,continuity,controls,doc_controls,documents,factory,finance,governance,grants,insights,ledger,mssqlstore,procurement,profile,projection,quality,ranking,recovery,resident_decisions,rulecards,signoffs,sqlstore,store,workflows,lawstore}.py",
  "tests/{dataset,release_support,test_chat_memory,test_chat_privacy,test_chatthreads,test_documents,test_finance_signoffs,test_generated_dataset,test_governance,test_needs_inventory,test_profile,test_quality_procurement,test_recovery,test_rulecards,test_sensor_backfill,test_sensor_plausibility,test_sqlreads,test_sqlstore,test_synthetic_provenance}.py",
]

[tool.ruff.lint.per-file-ignores]
"src/zava_forward/core/synthetic/{loadcheck,scale_fixture,sensor_backfill}.py" = ["E501", "E701", "E702", "E741", "I001", "UP", "B", "F841", "F401"]
"src/zava_forward/core/{ai,ai_registry,ai_tasks,assistant_release,assistants,chat_isolation,chat_privacy,chatthreads,continuity,controls,doc_controls,documents,factory,finance,governance,grants,insights,ledger,mssqlstore,procurement,profile,projection,quality,ranking,recovery,resident_decisions,rulecards,signoffs,sqlstore,store,workflows,lawstore}.py" = ["E501", "E701", "E702", "E741", "I001", "UP", "B", "F841"]
"tests/{dataset,release_support,test_chat_memory,test_chat_privacy,test_chatthreads,test_documents,test_finance_signoffs,test_generated_dataset,test_governance,test_needs_inventory,test_profile,test_quality_procurement,test_recovery,test_rulecards,test_sensor_backfill,test_sensor_plausibility,test_sqlreads,test_sqlstore,test_synthetic_provenance}.py" = ["E501", "E701", "E702", "E741", "I001", "UP", "B", "F841", "F401"]

[[tool.mypy.overrides]]
module = [
  "zava_forward.core.ai", "zava_forward.core.ai_registry", "zava_forward.core.ai_tasks", "zava_forward.core.assistant_release", "zava_forward.core.assistants", "zava_forward.core.chat_isolation", "zava_forward.core.chat_privacy", "zava_forward.core.chatthreads", "zava_forward.core.continuity", "zava_forward.core.controls", "zava_forward.core.doc_controls", "zava_forward.core.documents", "zava_forward.core.factory", "zava_forward.core.finance", "zava_forward.core.governance", "zava_forward.core.grants", "zava_forward.core.insights", "zava_forward.core.ledger", "zava_forward.core.mssqlstore", "zava_forward.core.procurement", "zava_forward.core.profile", "zava_forward.core.projection", "zava_forward.core.quality", "zava_forward.core.ranking", "zava_forward.core.recovery", "zava_forward.core.resident_decisions", "zava_forward.core.rulecards", "zava_forward.core.signoffs", "zava_forward.core.sqlstore", "zava_forward.core.store", "zava_forward.core.workflows", "zava_forward.core.lawstore",
  "zava_forward.core.synthetic.loadcheck", "zava_forward.core.synthetic.scale_fixture", "zava_forward.core.synthetic.sensor_backfill",
  "dataset", "release_support", "test_chat_memory", "test_chat_privacy", "test_chatthreads", "test_documents", "test_finance_signoffs", "test_generated_dataset", "test_governance", "test_profile", "test_quality_procurement", "test_recovery", "test_rulecards", "test_sqlreads", "test_sqlstore",
  "test_needs_inventory", "test_sensor_backfill", "test_sensor_plausibility", "test_synthetic_provenance",
  "tests.dataset", "tests.release_support", "tests.test_chat_memory", "tests.test_chat_privacy", "tests.test_chatthreads", "tests.test_documents", "tests.test_finance_signoffs", "tests.test_generated_dataset", "tests.test_governance", "tests.test_profile", "tests.test_quality_procurement", "tests.test_recovery", "tests.test_rulecards", "tests.test_sqlreads", "tests.test_sqlstore",
  "tests.test_needs_inventory", "tests.test_sensor_backfill", "tests.test_sensor_plausibility", "tests.test_synthetic_provenance",
]
ignore_errors = true

# chat_panel is typed; it calls siblings that still wait for their typing pass (M6).
[[tool.mypy.overrides]]
module = ["zava_forward.core.chat_panel", "zava_forward.core.rule_engine"]
disallow_untyped_calls = false

[tool.setuptools.package-data]
"zava_forward.core" = ["policies/*.json", "law/*.json"]

# Typed test harness calling the migrated, not-yet-typed Store interface.
[[tool.mypy.overrides]]
module = ["test_stock_reconciliation", "tests.test_stock_reconciliation",
          "test_handoff_lifecycle", "tests.test_handoff_lifecycle",
          "test_hazard_referral", "tests.test_hazard_referral",
          "test_sensor_stock", "tests.test_sensor_stock",
          "test_resident_decisions", "tests.test_resident_decisions"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["test_rule_engine", "tests.test_rule_engine",
          "test_taskqueues", "tests.test_taskqueues"]
disallow_untyped_calls = false
