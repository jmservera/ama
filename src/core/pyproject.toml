[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zava-forward-core"
dynamic = ["version"]
description = "Zava Forward shared domain, data access and rules library"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
sql = ["mssql-python==1.15.0"]
blob = ["azure-storage-blob==12.31.0"]
dev = ["ruff==0.17.1", "mypy==2.4.0"]

[tool.setuptools.dynamic]
version = { attr = "zava_forward.core.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
mypy_path = ["src"]
explicit_package_bases = true
namespace_packages = true
files = ["src", "tests"]

# Modules moved unchanged from mvp/ (ADR 0006 move-not-copy). Formatting and typing follow after
# the migration so the renames stay pure and git history follows the files.
[tool.ruff.format]
exclude = ["src/zava_forward/core/ai.py", "src/zava_forward/core/profile.py", "src/zava_forward/core/rulecards.py", "tests/test_profile.py", "tests/test_rulecards.py"]

[tool.ruff.lint.per-file-ignores]
"src/zava_forward/core/ai.py" = ["E501", "E701", "E702", "E741", "I001", "UP", "B"]
"src/zava_forward/core/profile.py" = ["E501", "E701", "E702", "E741", "I001", "UP", "B"]
"src/zava_forward/core/rulecards.py" = ["E501", "E701", "E702", "E741", "I001", "UP", "B", "F841"]
"tests/test_profile.py" = ["E501", "E701", "E702", "E741", "I001", "UP", "B"]
"tests/test_rulecards.py" = ["E501", "E701", "E702", "E741", "I001", "UP", "B"]

[[tool.mypy.overrides]]
module = ["zava_forward.core.ai", "zava_forward.core.profile", "zava_forward.core.rulecards", "test_profile", "test_rulecards", "tests.test_profile", "tests.test_rulecards"]
ignore_errors = true
