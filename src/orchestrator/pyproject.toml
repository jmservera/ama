[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zava-forward-orchestrator"
dynamic = ["version"]
description = "Zava Forward scheduled jobs and orchestration"
requires-python = ">=3.12"
dependencies = ["zava-forward-core[sql,blob]>=0.1.0,<0.2"]

[project.optional-dependencies]
dev = ["ruff==0.17.1", "mypy==2.4.0"]

[tool.setuptools.dynamic]
version = { attr = "zava_forward.orchestrator.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
mypy_path = ["src"]
explicit_package_bases = true
namespace_packages = true
files = ["src", "tests"]

# Moved unchanged from mvp/ in M5 of #199; exemptions end in M6.
[tool.ruff.lint.per-file-ignores]
"src/zava_forward/orchestrator/{digest_blob,token_store}.py" = ["E501", "E701", "E702", "E741", "I001", "UP", "B", "F841", "F401"]
"tests/{test_digest_blob,test_token_store}.py" = ["E501", "E701", "E702", "E741", "I001", "UP", "B", "F841", "F401"]

[tool.ruff.format]
exclude = ["src/zava_forward/orchestrator/{digest_blob,token_store}.py", "tests/{test_digest_blob,test_token_store}.py"]

[[tool.mypy.overrides]]
module = ["zava_forward.core.*", "zava_forward.orchestrator.digest_blob", "zava_forward.orchestrator.token_store", "test_digest_blob", "test_token_store", "tests.test_digest_blob", "tests.test_token_store"]
ignore_errors = true
follow_imports = "skip"
