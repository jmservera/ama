[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zava-forward-agents"
dynamic = ["version"]
description = "Zava Forward proposal-only assistants, task registry and evaluation"
requires-python = ">=3.12"
dependencies = ["zava-forward-core>=0.1.0,<0.2"]

[project.optional-dependencies]
dev = ["ruff==0.17.1", "mypy==2.4.0"]

[tool.setuptools.dynamic]
version = { attr = "zava_forward.agents.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
mypy_path = ["src"]
explicit_package_bases = true
namespace_packages = true
files = ["src", "tests"]

# Moved unchanged from mvp/ (ADR 0006 move-not-copy); formatting and typing follow after the migration.
[tool.ruff.format]
exclude = ["src/zava_forward/agents/ai_eval.py", "tests/{chat_fixture,test_ai_eval,test_ai_identity,test_chat_fixture,test_eval_registry}.py"]

[tool.ruff.lint.per-file-ignores]
"src/zava_forward/agents/ai_eval.py" = ["E501", "E731", "E701", "E702", "E741", "I001", "UP", "B", "F841"]
"tests/{chat_fixture,test_ai_eval,test_ai_identity,test_chat_fixture,test_eval_registry}.py" = ["E501", "E701", "E702", "E741", "I001", "UP", "B", "F841"]

[[tool.mypy.overrides]]
module = ["zava_forward.agents.ai_eval", "chat_fixture", "test_ai_eval", "test_ai_identity", "test_chat_fixture", "test_eval_registry", "tests.chat_fixture", "tests.test_ai_eval", "tests.test_ai_identity", "tests.test_chat_fixture", "tests.test_eval_registry"]
ignore_errors = true

# core ships no py.typed marker until its own typing pass (M6); agents sees it as untyped.
[[tool.mypy.overrides]]
module = ["zava_forward.core.*"]
ignore_errors = true
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["regulatory_fixture"]
follow_imports = "skip"
ignore_missing_imports = true
