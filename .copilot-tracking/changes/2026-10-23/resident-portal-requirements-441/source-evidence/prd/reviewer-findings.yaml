findings:
  - finding_id: req-qual-001
    checklist_item: exact-candidate-verification
    status: RISK
    severity: HIGH
    location:
      section: "Candidate source and amendment.patch"
    finding: "The exact v0.19.0 candidate could not be reconstructed or hash-checked in this review. The accessible checkout file is v0.17.0 rather than the specified pinned v0.18.0 base, and the validator could not be executed; therefore the patch's exact application, preserved definitions, identifiers, and line-level coverage remain unverified."
    recommendation: "Before relying on this Validate result, supply the exact pinned base and candidate output or have the parent run the read-only in-memory validator, then review the resulting exact candidate bytes."
  - finding_id: req-qual-002
    checklist_item: upstream-authority-and-handoff
    status: RISK
    severity: HIGH
    location:
      section: "Optional resident-service direction; upstream authority boundary"
      line_range: L78-L109
    finding: "Inherited upstream limitation: the referenced BRD v0.20.0 is an unsigned draft amendment, not a canonical approved handoff; its Define exit is BLOCKED and Govern is NOT_EVALUATED. The PRD package accurately discloses this, but that input cannot be treated as approved authority or as evidence that a lifecycle gate has passed."
    recommendation: "Keep the PRD amendment unsigned and Validate blocked; do not convert structural links or the draft handoff into approval evidence. Reassess against a valid governed upstream input before claiming downstream approval."
  - finding_id: req-qual-003
    checklist_item: smart-product-goal
    requirement_id: GOAL-005
    status: CAUTION
    severity: MEDIUM
    location:
      section: "Product Goals"
      line_range: L385-L386
    finding: "Amendment-specific: GOAL-005 defines six measurable synthetic scripts, but its acceptance milestone has no stated date or measurement window and its feasibility is explicitly unconfirmed. It therefore fails the SMART time-bound and achievable checks; the draft appropriately labels its status deferred."
    recommendation: "Before treating GOAL-005 as passing, state a review date or bounded measurement window and record feasibility evidence; otherwise retain the deferred status and do not claim the goal passes SMART."
  - finding_id: req-qual-004
    checklist_item: upstream-consistency-and-activation-boundary
    requirement_id: FR-070
    status: CAUTION
    severity: MEDIUM
    location:
      section: "Resident-answer and communication authority; FR-070 and AC-129"
      line_range: L1044-L1054
    finding: "Inherited upstream contradiction: BRD FR-044 requires universal human review while amended AC-084 allows policy disposition. The PRD surfaces this conflict, keeps per-message review as the default, and gates the simulated policy test; routine-dispatch activation remains blocked until the parent reconciles the wording and authority."
    recommendation: "Keep routine activation OFF and retain human review. Reconcile BRD FR-044/AC-084 and resolve OD-53 before enabling any exception; do not use the PRD or an ADR to silently choose the permissive interpretation."
  - finding_id: req-qual-005
    checklist_item: constraint-quality-validation
    status: CAUTION
    severity: MEDIUM
    location:
      section: "Constraints"
    finding: "The package states that all nine inherited CON definitions are unchanged and adds no CON items, but the exact pinned candidate and each CON row were not available for independent inspection. Imposing source, affected boundary, non-negotiability, category, and separation from NFRs/design decisions therefore remain unverified in this pass."
    recommendation: "Verify each CON-### against the exact pinned candidate before relying on constraint-quality coverage; retain imposed boundaries as CONs and keep desired functionality, quality targets, and design choices under FR, NFR, and DD respectively."
