notes: The Define gate is blocked by canonical taxonomy and coverage, not by lack of substantive business analysis. The BRD is strong as a research and control-plane document, with clear evidence classification, dated regulatory caveats, legacy acceptance criteria and staged approval controls. The parent should judge legacy coverage separately from canonical payload coverage.
