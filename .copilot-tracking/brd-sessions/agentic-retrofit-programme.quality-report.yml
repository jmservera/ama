findings:
  - finding_id: req-qual-001
    checklist_item: taxonomy-canonical-identifiers
    status: RISK
    severity: HIGH
    location:
      section: Document Status and Business Requirements
      line_range: L30-L40, L588-L592
    finding: The BRD explicitly records that it uses BR-001 through BR-068 as proposed requirements, but the canonical BRD taxonomy in force requires FR, AC, NFR, CON and BR, with BG as the adjacent business-goal namespace. A canonical scan found zero FR, AC, NFR, CON and BG identifiers.
    recommendation: Add a migration or refactor pass that assigns canonical FR, AC, NFR, CON, BR and BG identifiers, preserving legacy BR and OBJ references as aliases where needed.
  - finding_id: req-qual-002
    checklist_item: fr-to-ac-coverage
    status: RISK
    severity: CRITICAL
    location:
      section: Business Requirements
      line_range: L588-L717
    finding: Canonical FR-to-AC coverage is 0.0% because the BRD contains no FR-### or AC-### items, even though each legacy BR row has an acceptance-criteria column. This fails the Define threshold of 80.0%.
    recommendation: Convert legacy BR rows that describe solution behaviour into FR-### items and convert or link their acceptance-criteria cells to AC-### identifiers.
  - finding_id: req-qual-003
    checklist_item: fr-to-bg-traceability
    status: RISK
    severity: HIGH
    location:
      section: Requirements Traceability
      line_range: L1006-L1021
    finding: The traceability table maps OBJ-## objectives to BR-### rows, not canonical BG-### goals to FR-### requirements. The table is useful as legacy evidence but cannot satisfy FR-to-BG traceability.
    recommendation: Create BG-### identifiers for the business goals and add a canonical FR-to-BG traceability matrix; keep the existing OBJ-to-BR table as a legacy cross-reference.
  - finding_id: req-qual-004
    checklist_item: brd-frontmatter-metadata
    status: CAUTION
    severity: MEDIUM
    location:
      section: Frontmatter and Document Status
      line_range: L1-L22
    finding: The document has title, description, date and status, but it does not record a stable BRD id, semantic draft version, active phase, coverage thresholds or identifier-family configuration in frontmatter. The review therefore had to derive id and phase from path and invocation context.
    recommendation: Add the BRD frontmatter overlay fields for id, version, phase, threshold values and identifier families.
  - finding_id: req-qual-005
    checklist_item: iso-29148-conforming
    status: RISK
    severity: HIGH
    location:
      section: Business Requirements
      line_range: L592-L716
    finding: The requirement set is not conforming to the active schema because one BR namespace carries functional controls, rules, constraints and NFR-like quality controls. Acceptance criteria are table cells rather than separately identifiable AC records.
    recommendation: Classify each legacy BR row by requirement type, split rows into canonical namespaces and add explicit AC identifiers.
  - finding_id: req-qual-006
    checklist_item: iso-29148-singular
    status: RISK
    severity: MEDIUM
    location:
      section: Safety, Automation and Quality Requirements
      line_range: L598-L599, L693-L704
    finding: Several requirements are compound. For example BR-062 combines capture, referral, timestamp, ownership, escalation, contractor script and safety-hold obligations, while BR-046 combines gate enforcement, authority matrix, AI boundaries, blocked actions, routing and resident-contact controls.
    recommendation: Split compound rows into atomic requirements and link them through traceability rather than packing multiple obligations into one row.
  - finding_id: req-qual-007
    checklist_item: smart-business-goals
    status: CAUTION
    severity: MEDIUM
    location:
      section: Business Objectives and Success Metrics
      line_range: L358-L369
    finding: The BRD's OBJ rows are strong legacy goal equivalents, but only 5 of 12 pass all SMART checks. Several defer the actual target to future board-approved thresholds or company data, such as OBJ-01, OBJ-06, OBJ-08, OBJ-09 and OBJ-10.
    recommendation: Convert OBJ rows into BG-### goals and add numeric target values, timeframe anchors and accountable measurement sources for each goal before Govern.
  - finding_id: req-qual-008
    checklist_item: iso-25010-nfr-classification
    status: CAUTION
    severity: MEDIUM
    location:
      section: Data, Automation, Evaluation and Regulatory Requirements
      line_range: L673-L716
    finding: The BRD contains substantive quality controls for security, reliability, usability, maintainability and governance, but none is classified as NFR-###. ISO 25010 category coverage therefore cannot be computed canonically.
    recommendation: Extract measurable NFR-### rows for security, privacy, reliability, usability, maintainability, interoperability and continuity, with thresholds and verification methods.
  - finding_id: req-qual-009
    checklist_item: con-specific-quality
    status: RISK
    severity: HIGH
    location:
      section: Regulatory Timing and Regulatory Knowledge
      line_range: L116-L156, L710-L716
    finding: The BRD describes externally imposed regulatory, funding, data-protection and legal boundaries, but it has no CON-### constraint rows. Constraint-specific checks for imposing source, affected boundary, non-negotiability, category and separation from BR or NFR cannot be satisfied canonically.
    recommendation: Extract imposed boundaries into CON-### rows and record source, affected boundary, non-negotiability, category and approving authority for exceptions.
  - finding_id: req-qual-010
    checklist_item: open-decisions-define-readiness
    status: CAUTION
    severity: MEDIUM
    location:
      section: Assumptions and Open Decisions; Live-Pilot Approval
      line_range: L914-L950, L1042-L1055
    finding: The BRD properly records 33 open decisions, including OD-26 through OD-33 from the latest revision, but many are prerequisites for live pilot evidence and authority. Define can proceed with these visible, but they remain blockers for later approval.
    recommendation: Mark which OD items block Define exit, shadow mode, live pilot or scale, and add owners, due dates and required evidence for each blocker.
  - finding_id: req-qual-011
    checklist_item: legacy-acceptance-criteria-presence
    status: COVERED
    severity: N/A
    location:
      section: Business Requirements
      line_range: L592-L717
    finding: Every legacy BR row has a non-empty acceptance-criteria cell, giving 68 of 68 legacy requirement rows an acceptance intent.
    recommendation: null
  - finding_id: req-qual-012
    checklist_item: evidence-classification
    status: COVERED
    severity: N/A
    location:
      section: Evidence Classification
      line_range: L78-L87
    finding: The BRD clearly separates case-study facts, sector-informed recommendations, planning assumptions or value hypotheses, and unknown company detail.
    recommendation: null
  - finding_id: req-qual-013
    checklist_item: regulatory-dating-and-caveats
    status: COVERED
    severity: N/A
    location:
      section: Regulatory Timing and Source and Review Record
      line_range: L116-L156, L1116-L1118
    finding: The BRD dates local regulatory snapshots, distinguishes current-use caveats and states that citations were checked against local snapshots rather than official online sources.
    recommendation: null
  - finding_id: req-qual-014
    checklist_item: legacy-objective-traceability
    status: COVERED
    severity: N/A
    location:
      section: Requirements Traceability
      line_range: L1006-L1021
    finding: The legacy traceability table links every OBJ row to supporting BR rows, which is useful coverage evidence for the BRD's own pre-canonical structure.
    recommendation: null
  - finding_id: req-qual-015
    checklist_item: staged-approval-controls
    status: COVERED
    severity: N/A
    location:
      section: Validation and Approval Criteria
      line_range: L1023-L1078
    finding: The BRD separates readiness, shadow, live-pilot, tranche and scale approval, and makes clear that approval to gather evidence is not approval to deploy AI, instruct works, commit capital or claim grant.
    recommendation: null
