speaker_notes: |
  TIMING: 14:15-15:45 (90 seconds).

  These are four outcome categories the executive team can own and test.
  Programme leadership measures whether coordination effort and cycle time
  fall. Finance measures attributable avoided expenditure, eligible grant
  conversion and cash exposure. Resident leadership measures lived outcomes.
  Assets and quality leadership measure accepted work and defects.

  The key phrase is attributable improvement. The association would obtain
  some benefits from retrofit even without new technology. We cannot claim
  the whole capital programme as the return on an AI investment.

  Likewise, staff time released is capacity until a budget owner confirms
  that expenditure will reduce. Grant already assumed in the plan is not a
  new benefit; receiving it earlier is a timing improvement. Resident savings
  are resident value, not landlord cash. Better governance matters, but we
  should not invent a large borrowing-capacity benefit without a treasury model.

  Compare the selected option with process improvement and conventional
  workflow. Include integration, data remediation, licences, support, training,
  human review, assurance and exit costs. If AI does not add value, choose the
  simpler option while retaining the stronger operating controls.

  TRANSITION: That is why we propose staged proof rather than one large
  transformation commitment.

  SOURCE: BRD, CXO Value Proposition, Separate Investment Cases and Attribution,
  Benefits Validation Register, BR-029, BR-043 and BR-049.
