speaker_notes: |
  TIMING: 10:50-12:25 (95 seconds).

  The four questions from the opening now become four service commitments to
  validate. Clear choices means property-specific, accessible information,
  not an automated campaign designed to maximise acceptance. Silence or survey
  access is not agreement to installation.

  Reliable appointments mean supplier capacity has been confirmed, necessary
  adjustments are understood and the resident receives honest updates.
  An incomplete appointment must not automatically become resident refusal.

  A usable home means more than a contractor reporting a finished job.
  It includes competent quality acceptance, accessible operating guidance and
  aftercare. A person who can help means an accountable route to challenge a
  decision, report a defect or make a complaint without losing other services.

  Energy outcomes need equal care. A household that previously under-heated
  its home may choose greater comfort rather than lower consumption. Tariffs,
  weather, occupancy and the measure itself affect bills. We should measure
  comfort, affordability and adverse outcomes instead of promising universal
  savings.

  These are proposed standards, not claims that residents have validated the
  service. Representative digital and non-digital journey testing is a
  condition of live use.

  TRANSITION: The same discipline we apply to resident promises must apply to
  the financial story.

  SOURCE: BRD, BR-011 through BR-020, BR-036, BR-037, BR-051,
  Pilot Evaluation and CXO Value Proposition.
