speaker_notes: |
  TIMING: 09:15-10:50 (95 seconds).

  Return to our illustrative home. Instead of a coordinator searching several
  records for the current version, the proposed service assembles a sourced
  pack and shows what is missing. Instead of another message asking who owns
  the next step, the exception has a named recipient and a required decision.

  Suppose the proposed design changes. The workflow must invalidate the
  affected downstream approvals. The resident may need updated information
  and a renewed decision; funding and supplier arrangements may need review.
  The system must not keep the installation date simply because that makes
  the dashboard look better.

  The opportunity is to reduce administrative effort and make professional
  review more focused. We are not yet claiming a particular saving. The pilot
  has to count the effort to review AI drafts, handle false flags and maintain
  controls as well as the time it removes.

  The right-hand side is the proposed future experience, not a description of
  a deployed product. It provides a concrete scenario for a later demo:
  evidence arrives, an exception is identified, a person decides and the
  property state updates with an audit trail.

  ANIMATION CUES: Keep the current-state panel visible. Click once to reveal
  the complete future-state panel as a single contrast, not line by line.
  Click again for the missing-approval statement.

  TRANSITION: A more efficient team is valuable only if the resident also
  experiences a more dependable service.

  SOURCE: BRD, Future-State Lifecycle; BR-008, BR-017 through BR-019,
  BR-041, BR-046 and BR-049.
