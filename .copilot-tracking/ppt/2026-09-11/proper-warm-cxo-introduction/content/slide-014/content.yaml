speaker_notes: |
  TIMING: 18:40-20:00 (80 seconds).

  Close with a proportionate decision. Authorise a capped readiness stage,
  subject to agreeing the budget, boundaries and delegated authority. We do
  not have a validated price or return figure to ask this team to accept today.

  Name the Executive Director of Assets as sponsor, supported by the Chief
  Executive, with Finance, Safety, Programme, Resident Engagement, Procurement,
  Digital and data-protection ownership. Return with validated constraints,
  options, economics and the proposed shadow and live-pilot gates.

  We are not seeking approval for a five-agent portfolio rollout, recognition
  of forty million pounds as secured grant or acceleration beyond the approved
  capital plan.

  End on the promise we can responsibly make about the approach: start with
  the resident outcome, make evidence and accountability visible, and earn the
  right to scale.

  ANIMATION CUES: Reveal the decision in three clicks: Authorise, Assign and
  Return. Reveal each verb with its complete statement. The final click reveals
  the handoff to architecture and the property-journey demo.

  HANDOFF FOR LATER EXTENSION: Append the architecture section after this
  introduction, explaining systems of record, workflow gates, human approval,
  bounded AI and continuity. Follow it with a demo of the illustrative home:
  evidence arrives, an exception is raised, an accountable person decides,
  resident arrangements are checked and the next safe step is recorded.
  These later sections are not included or counted in the twenty minutes.

  SOURCE: BRD, Executive Summary; Validation and Approval Criteria; BR-050.
