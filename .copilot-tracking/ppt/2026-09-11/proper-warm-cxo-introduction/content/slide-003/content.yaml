speaker_notes: |
  TIMING: 02:00-03:30 (90 seconds).

  The discussion produced four material clarifications.

  First, success is not the number of agents, tasks or installation starts. It
  is safe, resident-accepted and evidence-complete handover.

  Second, mandatory controls and approvals remain deterministic and human-owned.
  AI may recommend, draft, reconcile and flag. It must not diagnose hazards,
  infer consent, commit capital, award contracts, submit claims or accept work.

  Third, the underlying retrofit capital case must be separated from the
  incremental technology case. Only improvement over a credible alternative
  counts as technology value.

  Fourth, the decision today is not full rollout. It is a capped readiness
  stage, followed only by separately approved shadow and live pilots.

  Keep three qualifications visible throughout: the forty-million-pound funding
  opportunity is unsecured, sector figures are planning benchmarks rather than
  company facts, and warmer or healthier homes do not guarantee every bill
  will fall.

  TRANSITION: With those rules established, the business presentation starts
  with the resident experience. This is the hook for the story.

  SOURCE: Case Study 48 Addendum, Executive Assessment and What We Are
  Challenging; BRD, Executive Summary and Evidence Classification.
