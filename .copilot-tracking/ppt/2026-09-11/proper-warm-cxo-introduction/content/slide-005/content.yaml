speaker_notes: |
  TIMING: 04:55-06:15 (80 seconds).

  The case describes sixty thousand homes. That is fictional operating context,
  not a verified customer dataset. Applying the sector planning benchmark of
  twenty-six percent below EPC C produces fifteen thousand six hundred homes.
  Dividing that by four full delivery years produces three thousand nine
  hundred accepted completions annually.

  The arithmetic is useful for seeing the scale, but it is not an executable
  programme. We still need the address-level energy and condition baseline,
  actual accepted throughput, property mix, mobilisation period and capacity.
  Doubling an unknown delivery baseline is not a credible promise.

  There is real urgency without manufacturing certainty. The BRD records
  current hazard duties and forthcoming regulatory phases as at 11 September
  2026, and treats EPC C by 2030 as proposed rather than an in-force deadline.
  It also records Wave 3 grant spend by March 2028 and delivery to September
  2028, but no award to this association is evidenced. These conditions require
  current official verification before decisions.

  The executive choice is not whether to care about speed. It is whether we
  have a trustworthy basis for deciding where and how to accelerate.

  ANIMATION CUES: Begin with the portfolio size. Click to introduce the
  below-EPC-C scenario with its qualification, then click to introduce the
  annual trajectory with its qualification. Never reveal a number separately
  from the label that explains its evidence status. The final click reveals
  the current-duty statement.

  TRANSITION: To create that basis, we must find the real constraint rather
  than assume that AI can remove every source of delay.

  SOURCE: BRD, OBJ-01/02, Provisional Sector Benchmark Pack, Regulatory Timing.
