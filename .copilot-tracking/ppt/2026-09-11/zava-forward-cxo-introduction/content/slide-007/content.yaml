speaker_notes: 'TIMING: 07:55-09:15 (80 seconds).


  Here is the solution in business language. For each home, establish the

  evidence, make accountability explicit and identify the next safe step.

  Across the portfolio, show executives where work is progressing, where it

  is held and what decision or resource would unblock it.


  The BRD calls the enabling capability a portfolio control plane. Think of

  that as a shared workflow and evidence layer joining the existing asset,

  housing, repairs, finance and contractor services. It is not a proposal to

  replace all of those systems.


  Rules enforce mandatory gates. People retain decisions about safety,

  technical approval, resident agreement, investment, contracts, grants and

  quality. Bounded AI can prepare sourced drafts, reconcile information and

  identify anomalies. It does not become a new accountable executive or a

  substitute for a competent professional.


  ANIMATION CUES: Reveal the proposition in three beats: trusted evidence,

  named owners, then the next safe step. Reveal each heading and its question

  together. The last click reveals the boundary statement about connecting

  existing services and using AI only where it earns its place.


  This is deliberately a business view. We will use a later architecture

  section to explain how the integration and controls work. Today the test is

  whether this operating model addresses the business problem.


  TRANSITION: What changes in the day-to-day work of the programme team?


  SOURCE: BRD, Operating Model and Authority; BR-043 through BR-048.

  '
