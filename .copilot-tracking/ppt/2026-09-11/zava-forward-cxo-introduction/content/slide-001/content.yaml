speaker_notes: 'TIMING: 00:00-00:45 (45 seconds). Total presentation: 20 minutes.


  Open with the outcome, not the technology. Zava Forward is about making the

  route from an investment decision to a better home more dependable. For

  residents, the outcome is a home that is safe, comfortable and usable. For

  this executive team, it is confidence that money, people and suppliers are

  producing accepted outcomes rather than activity that still needs rework.


  First, we will establish what the fictional case asked for and the

  clarifications that emerged from the team discussion. We will then begin the

  business presentation with one resident journey before moving through the

  operating model, value and decision.


  This is a fictional association and a draft proposition. The programme name

  is a working identity, not cleared for resident-facing use. Do not present

  the design as established corporate branding.


  TRANSITION: Before the story begins, be clear about the case we were asked

  to solve.


  SOURCE: docs\brds\agentic-retrofit-programme-brd.md, Executive Summary and

  CXO Value Proposition (11 September 2026). All subsequent BRD references

  identify sections or requirement IDs in this document. The original case

  study and executive addendum remain separate source documents.

  '
