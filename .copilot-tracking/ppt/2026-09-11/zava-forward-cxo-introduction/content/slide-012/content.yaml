speaker_notes: 'TIMING: 15:45-17:15 (90 seconds).


  The initial step is deliberately small enough to make a better decision:

  establish readiness. The proposed six-to-eight-week period validates the

  cohort, bottlenecks, people, suppliers, funding and technology options. The

  actual scope, cost ceiling and schedule require approval.


  Shadow mode then tests recommendations, drafts and exceptions without live

  commitments or resident contact. It gives us a chance to compare AI with

  simpler workflow and to examine errors before they affect delivery.


  The live pilot is proposed for one locality and a small number of understood

  archetypes, with a retained cross-functional team and ring-fenced supplier

  and quality capacity. Its indicative six-to-nine-month duration is not a

  promise that procurement and mobilisation can be compressed into that time.

  Readiness must resolve the actual critical path.


  Only then do we repeat schemes and release further investment in tranches.

  Every phase has independent control-owner evidence, and acceleration beyond

  the approved annual plan requires Board approval.


  Current hazard response and eligible grant activity continue throughout.

  The digital programme must not become a reason to postpone existing duties.


  ANIMATION CUES: Readiness is visible first. Click once for shadow mode, once

  for the bounded live pilot, once for repeat schemes and once for selective

  scale. Reveal each phase number, heading and description together. The final

  click reveals the evidence-and-approval statement.


  TRANSITION: What evidence should cause this executive team to say yes, pause

  or choose a different option?


  SOURCE: BRD, Delivery Phases and Approval Gates, BR-030, BR-047, BR-050,

  Validation and Approval Criteria.

  '
