speaker_notes: 'TIMING: 03:30-04:55 (85 seconds).


  HOOK: One home can be complete in every system and still be unfinished for

  the resident.


  Invite the audience to imagine one home entering the programme. These are

  illustrative questions, not quotations from resident research. A resident

  wants to understand the proposed work, decide what is right for their home,

  organise access and know who will help afterwards.


  Internally, those questions cross housing, assessment, finance, procurement,

  contractor and quality responsibilities. Each team can complete its own task

  while the overall journey still stalls. A survey can be complete while a

  design remains unresolved. A contractor can report completion while the

  resident still lacks usable guidance or a defect remains open.


  The business problem is therefore not simply the number of spreadsheets.

  It is the possibility that nobody has a reliable view of what this particular

  home needs next, who is accountable and whether it is safe to proceed.

  Repeated contact and uncertain appointments are potential consequences to

  investigate, not established findings about this fictional provider.


  ANIMATION CUES: The title and first journey stage are visible. Click once for

  Decide, once for Prepare and once for Live with it. Click again to reveal the

  internal teams; make the contrast that the resident sees one journey. The

  final click reveals the uncertainty statement. Pause before saying it.


  Pause briefly: which handoff would the executive team most want confidence

  in? Use the question to make the problem concrete, not to open a long debate.


  TRANSITION: Now multiply this need for a dependable journey across the

  portfolio, while being honest about what we do and do not know.


  SOURCE: BRD, Problem Statement; BR-011 through BR-020; BR-036 and BR-051.

  '
