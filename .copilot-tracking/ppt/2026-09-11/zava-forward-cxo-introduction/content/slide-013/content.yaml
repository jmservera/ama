speaker_notes: 'TIMING: 17:15-18:40 (85 seconds).


  These are proposed pilot targets, not a sales guarantee. The BRD proposes

  eighty to one hundred candidate homes and at least fifty accepted handovers,

  a twenty-percent reduction in assessment-to-ready-to-install time and a

  twenty-five-percent reduction in coordination effort per accepted home.


  Before testing, agree the baseline, comparison cohort, definitions and

  thresholds. Count the human time needed to review drafts and manage

  exceptions. Keep paused, incomplete, excluded and reopened cases visible;

  otherwise the apparent improvement could just reflect cherry-picking.


  An accepted handover means the relevant approvals, resident decision or

  separately authorised lawful process, physical and documentary quality,

  defect controls and accessible handover are satisfied. It is not simply

  a contractor''s completion notification. Energy outcomes are separate.


  The guardrails are non-negotiable. No unauthorised starts, no autonomous

  controlled approvals and no unresolved safety-critical or material defects

  at handover. Test critical exceptions before live use and retain independent

  assurance. Fifty successful handovers cannot establish zero live risk.


  Also disclose what the pilot cannot yet prove, particularly seasonal comfort

  and energy outcomes. A failure of the AI value case should stop expansion or

  lead to a conventional workflow option, not weaker acceptance criteria.


  ANIMATION CUES: Keep the non-negotiable safeguard visible from the start.

  Reveal all three proposed targets together on one click so efficiency never

  appears before the conditions that govern it. Click once more for the

  baseline and completeness reminder.


  TRANSITION: That brings us to the decision we recommend today.


  SOURCE: BRD, OBJ-02, OBJ-11, OBJ-12; Pilot Evaluation; BR-049/050.

  '
