speaker_notes: 'TIMING: 00:45-02:00 (75 seconds).


  This is the case as it arrived, before challenge or redesign. Proper North

  Homes is fictional. The case describes sixty thousand homes, spreadsheet-led

  coordination, delivery behind plan, statutory safety obligations and a

  proposed 2030 energy ambition.


  It also arrives with a preferred answer: five collaborating agents intended

  to prioritise homes, draft assessments and grants, coordinate contractors and

  residents, and verify quality. The expected outcomes include doubled delivery,

  forty million pounds of grant capture and lower energy bills.


  Those statements combine four different things: fictional context, a proposed

  technology design, planning assumptions and claimed benefits. They should not

  be given the same evidence status. The need to improve delivery is credible;

  the answer, baseline and quantified value are not yet proven.


  TRANSITION: The team discussion did not reject the ambition. It changed what

  would count as a responsible solution and approval request.


  SOURCE: Original Case Study 48; BRD, Source Context and Original Request.

  '
