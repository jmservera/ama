speaker_notes: 'TIMING: 12:25-14:15 (110 seconds).


  This slide establishes scale and financial discipline, not an investment

  return. The provisional cohort of fifteen thousand six hundred homes at

  twenty thousand pounds each gives three hundred and twelve million pounds.

  Those inputs require company and archetype validation.


  If the entire cohort qualified for the ordinary full-cap scenario of seven

  thousand five hundred pounds per home, the illustrated grant ceiling is one

  hundred and seventeen million pounds. The provider balance is still one

  hundred and ninety-five million on the same cost basis.


  Neither the ceiling nor the forty-million-pound opportunity in the original

  request is an award. They must not be added together. If only forty million

  were ultimately received against this full programme cost, the balance would

  be two hundred and seventy-two million. Actual eligibility, scheme averaging

  rules, allocation, claims and receipt timing govern the funding case.


  The cost input is called fully loaded, but its inclusions are not yet clear.

  We must map them before adding technology, overhead, financing, enabling

  work or contingency, otherwise we could double count costs.


  The solution''s financial contribution is more disciplined capital allocation,

  less avoidable expenditure and better conversion of eligible awards into

  compliant claims and cash. It does not fund the works by itself. Monthly

  liquidity, match funding and covenant headroom remain executive controls.


  ANIMATION CUES: Start with gross programme cost and the calculation. Click

  once to reveal the grant ceiling with its qualification, then click again

  to reveal the provider balance with its qualification. The final click

  reveals the warning that the separate GBP 40 million opportunity is

  unverified.


  TRANSITION: To make a credible technology investment case, separate this

  underlying capital programme from the incremental value of the new service.


  SOURCE: BRD, BR-025 through BR-031; Illustrative Economics and Review Qualifications.

  '
