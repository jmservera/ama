speaker_notes: 'TIMING: 06:15-07:55 (100 seconds).


  The tempting answer is to put an agent on every spreadsheet. That may improve

  administration, but the next home still needs reliable property information,

  competent professional input, an available supplier, appropriate resident

  arrangements and funding the association can afford.


  If design capacity is the constraint, generating more survey packs can grow

  the queue rather than increase accepted outcomes. If supplier capacity is

  unavailable, a faster scheduling recommendation does not create a crew.

  If a resident needs an adjustment, optimisation cannot wish that need away.

  These are examples of why we need evidence about the bottleneck, not claims

  that these exact failures have been observed at Zava North Homes.


  Our first intervention is therefore a readiness exercise. Measure time at

  each stage, why work waits, how often evidence is rejected and how much

  effort is spent correcting or chasing it. Compare process redesign,

  configuration of existing systems, conventional workflow and bounded AI.


  This is not a reason to abandon technology. It is how we direct technology

  at a constraint it can actually relieve. The proposition should release

  scarce specialist time for judgement, not replace professional competence.


  Ask the executive team to hold one test in mind: will this change increase

  accepted outcomes, or merely move the backlog to another team?


  TRANSITION: The answer we propose is a dependable operating model, with

  technology supporting the next safe step.


  SOURCE: BRD, Executive Summary, BR-022, BR-043, BR-044 and trade-offs.

  '
