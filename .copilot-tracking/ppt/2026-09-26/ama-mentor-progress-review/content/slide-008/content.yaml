speaker_notes: |
  The challenge confirmed and sharpened the control plane I had proposed on 11
  September. What changed on 26 September is that every layer now traces to a role
  verdict, ten new BRD rows (BR-059 to BR-068) and five bounded AI candidates, each
  with a comparator and a stop criterion.

  Read the stack from the bottom. The foundation is a portfolio control plane: a
  deterministic layer with a property master keyed on UPRN, lifecycle gates and
  statutory clocks, a hazard case record, a resident decision record, a capacity
  register, a grant ledger and a defect register. Every one of the five requested
  agents depended on these records, and they deliver value without any AI.

  On top sit five bounded AI capabilities that came up across several roles. All of
  them recommend, draft or raise flags. None needs end-to-end ownership, and each
  must beat a non-agent comparator in shadow testing before it goes live. They are
  candidates for shadow testing, not tested yet.

  At the top, accountable people keep every decision that carries legal,
  professional or resident authority.

  That changes the ask to the board: not a five-agent rollout, but a capped
  readiness stage and gated pilots in one delivery cell.
