speaker_notes: |-
  So if the gap is shared records, not intelligence, why is this agent-led? Because the records do not fill themselves. What rests on a small team today is coordination, chasing, re-keying, reconciliation and evidence assembly, and that unstructured work is where agents help. Later on 26 September, a challenge to my own measurement plan showed the pilot bundled three changes: a new delivery cell, ring-fenced supplier capacity and agents, so it could never tell the Board which one worked. So I reframed it as agent-led modernisation of the existing retrofit model. Existing teams, suppliers and systems stay, and what I called the control plane is now the digital foundation. Whether coordination really is the binding constraint is still a Phase 0 question.

  Read the stack from the bottom. The foundation is deterministic, because decisions that residents, the Regulator, funders or the Board must be able to follow should come from rules. Agents sit where the work is unstructured, and people keep every decision with legal, professional or resident authority.

  The ask changes: agents added to existing teams in one locality and, as a proposal, each capability scales only if it beats the same workflow without it.
