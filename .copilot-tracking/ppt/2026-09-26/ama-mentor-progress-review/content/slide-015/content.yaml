speaker_notes: |
  This is how I kept a two-week research effort from turning into a pile of
  documents.

  On the left are the problem documents. The original case study is never edited,
  so the request is always visible. The addendum evolves with every finding, and
  the BRD carries the requirements with stable identifiers.

  In the middle is the knowledge base, organised on Andrej Karpathy's LLM Wiki
  pattern. An index routes any task to the right files. Regulatory sources are
  dated and immutable. Syntheses carry citations. Memory holds my own context and is
  explicitly not evidence. The log is append-only and records every ingest,
  correction and contradiction. The schema, the repository instructions, tells every
  agent how to use all of this.

  On the right is the working evidence: the tracking folders for each workflow, and
  Git history. Together they mean the next session, human or agent, starts from
  what we already know instead of rediscovering it.
