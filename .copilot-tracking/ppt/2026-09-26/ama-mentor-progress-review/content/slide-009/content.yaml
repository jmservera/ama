speaker_notes: |
  The last step so far was a formal BRD quality review. The first run failed hard:
  the BRD used legacy BR and OBJ identifiers, so the reviewer measured zero percent
  coverage from functional requirements to acceptance criteria and to business
  goals.

  I relabelled the whole document to a canonical taxonomy: 12 business goals, 41
  functional requirements, 73 acceptance criteria, 9 non-functional requirements
  grouped by ISO 25010, 6 imposed constraints and 23 business rules. Four compound
  rows were split, and a legacy map keeps every old reference valid. Coverage went
  from zero to one hundred percent. The 0 percent was an identifier-format problem,
  not missing requirements. Relabelling fixed traceability. It did not fix
  measurability.

  The review also extracted new structure: FR-022 was split into a functional
  requirement and a business rule, and CON-004 was flagged for Legal because its
  source sits outside the local corpus.

  The rerun still fails, and I think that is the right result. Seven business goals
  have no numeric target because the targets depend on company data or board
  decisions. I chose to leave the gate failing rather than invent numbers. I would
  like your view on that choice.
