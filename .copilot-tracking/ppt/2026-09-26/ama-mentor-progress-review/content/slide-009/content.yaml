speaker_notes: 'Two challenges asked whether I could prove the value and whether I
  could explain it. The first came before the reframe and caused it; the second came
  after.


  The first was my own idea: a dashboard showing the pilot accelerates delivery. All
  eight roles backed the intent and rejected the design. Speed is not the benefit;
  accepted handovers are. And, as you saw, it bundled three changes. About 50 handovers
  in six to nine months cannot prove a 20 percent gain. So there are now two comparisons:
  a pilot locality with agents against a matched locality without, and each agent
  capability against the same workflow without it.


  The second was a transparency review. It found an error of mine: CON-003 cited UK
  GDPR Article 22, but the local consolidated text omits it and uses Articles 22A
  to 22D. CON-003 now cites Articles 22A to 22C and maps human review to the four
  Article 22C(2) safeguards.


  Still a proposal: the pilot decides which agent capabilities scale.'
