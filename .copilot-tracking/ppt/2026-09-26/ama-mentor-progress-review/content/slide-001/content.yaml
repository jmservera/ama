speaker_notes: 'I have the story so far to show you, and four decisions I want your
  challenge on. The short version: the brief asks for five agents. Two weeks of evidence
  says the value is credible, but end-to-end agents are not the way to get it. Where
  I have landed is an agent-led modernisation of the existing retrofit model, with
  agents only where they beat the same workflow without them. One of my four questions
  is whether the panel will read that as answering the brief.


  I will walk through five strands of work, three later challenges, my lessons and
  one traceability chain, then my questions.'
