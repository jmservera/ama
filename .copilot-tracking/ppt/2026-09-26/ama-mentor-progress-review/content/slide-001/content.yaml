speaker_notes: |
  I have the story so far to show you, and four decisions I want your challenge
  on. The short version: the brief asks for five agents; two weeks of evidence
  says the value is real, but end-to-end agents are not the way to get it. One of
  the four decisions is whether that reframing will read as refusing the brief.

  The title is the story in one line. The brief asks me to build five agents. The
  work so far turned that into a different question: what business value do the
  people behind those agents actually expect, and what is the smallest thing that
  delivers it safely?

  I will cover five strands in order: research, role agents, BRD iterations, a
  design thinking challenge of the five agents, and a BRD quality review. Then
  the challenges, how the repository holds the evidence, and my questions for you.
