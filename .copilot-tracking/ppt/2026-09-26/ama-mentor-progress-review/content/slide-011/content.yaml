speaker_notes: 'Alongside all of this ran a formal BRD quality review, re-run after
  every change. The first run failed hard: the BRD used legacy BR and OBJ identifiers,
  so the reviewer measured zero percent coverage from functional requirements to acceptance
  criteria and business goals.


  I relabelled the document to a canonical taxonomy, with a legacy map so every old
  reference stays valid. Coverage went from zero to one hundred percent. That was
  an identifier-format problem, not missing requirements. Relabelling fixed traceability;
  it did not fix measurability.


  There have been six runs so far. It still fails, because seven business goals have
  no numeric target until company data or board decisions exist. I chose to leave
  the gate failing rather than invent numbers, and I would like your view on that.'
