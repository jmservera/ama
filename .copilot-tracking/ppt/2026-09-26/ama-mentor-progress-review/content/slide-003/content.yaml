speaker_notes: 'This is the backbone of the story. The five strands were not a straight
  line; each loop produced questions that sent me back into research.


  Research built the context. The role agents let me ask what the brief could not
  answer. The BRD has been revised in thirteen commits and is now version 0.5.0. The
  design thinking session on 26 September was the turning point: I read each agent
  request as the value behind it and tested my early doubts agent by agent. The quality
  review made the requirements traceable, and it was re-run after every later change.


  The habit that matters: nothing stayed in chat history. Every finding was filed
  in the addendum, the BRD or the knowledge base, and logged.'
