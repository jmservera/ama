speaker_notes: |-
  This slide is the honest origin of the turning point. The doubt about five agents built up over two weeks.

  On 11 September my first addendum already said that "agentic" is an implementation option and proposed a portfolio control plane, now called the digital foundation. On 19 September the BRD gained a cross-functional challenge to the five-agent request. Then came the regulatory context, the open-decision review and the modelled customer profile.

  What I lacked was evidence for each agent. On 26 September all eight role agents challenged each request, which added ten requirements and eight open decisions. Each BRD revision was the same pass: research, ask the roles, rewrite, log what changed and why.
