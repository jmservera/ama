speaker_notes: 'These are the four places I would most value your challenge.


  First, will the panel read agent-led modernisation, not five end-to-end agents,
  as answering the brief, or as stepping back from the five agents it asked for?


  Second, how much business depth versus architecture depth should the capstone show?


  Third, should the BRD keep failing where targets need company data, or should I
  propose clearly labelled illustrative targets?


  Fourth, which open divergence between the role agents should I resolve first?


  On the right is what comes next on the 85-day plan, to 5 December. There is still
  no real resident or staff evidence.


  And on the story itself: where did it lose you? Which question would you take first?'
