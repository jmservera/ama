speaker_notes: |-
  One more test, on 27 September. Would richer inputs change any verdict? Phone photos with location, structured invoices, sensors, drones, even a digital twin: twenty scenarios, with focused questions to the role agents.

  None moved a request to an end-to-end agent. Richer inputs enrich the digital foundation and widen what bounded agents can check, but they add duties before autonomy: special category data, Awaab's Law awareness, which a hazard photo can establish no later than its arrival, and payment and procurement rules.

  The useful output is the grid: lifecycle events first, then evidence packs for assessment, quality and damp. It is my coarse judgement of what Comparison 2 should test first, not a scaling decision.

  A post-merge review caught two errors: the same Article 22 citation I had fixed in CON-003, and eleven answers from roles that have no agent. I re-ran nine with the nearest roles and labelled two as my own hypotheses. Then I re-ran every other role answer against the reframed proposal. Every verdict held; six answers tightened controls to match the BRD. For example, AI risk paths stay in shadow mode, and a person approves every AI-drafted message to a resident.
