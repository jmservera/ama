speaker_notes: |-
  This slide is the reason for all the structure: immutable dated sources, cited syntheses, an index and an append-only log, on Karpathy's LLM Wiki pattern. The organisation is in the appendix. Any decision in the addendum can be walked back to its evidence, and this is a real chain.

  The decision: a capped readiness and pilot stage, not a five-agent rollout, with no end-to-end stock prioritisation agent. The evidence: the roles said eligibility is a rules question. The requirement: FR-026 requires a deterministic pass, fail or unknown eligibility result, tested by AC-039 and constrained by CON-005. The source: the Wave 3 technical annex, page 3, footnote 1, retrieved on 19 September. The change record: the 26 September log entries and commits.

  To challenge a decision, change one piece of evidence, such as a real throughput figure, and the chain shows what has to move.
