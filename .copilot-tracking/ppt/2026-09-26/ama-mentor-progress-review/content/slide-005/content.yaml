speaker_notes: 'The company is fictional, so there is nobody to interview. I created
  eight role agents, one for each perspective that owns part of a retrofit programme.


  They are research instruments, not simulated employees. They label every answer
  as a case fact, a sector hypothesis or an unknown. That stops an articulate answer
  from becoming a fake company fact. Their most useful output is the one question
  per role that would change its answer most; those questions are now the discovery
  agenda.


  One exchange: would a grant-drafting agent add value? The finance role answered
  with a fact from the local snapshot: in Greater Manchester and the West Midlands,
  Wave 3 money is allocated by formula, not by bid. Whether Zava North Homes operates
  there is unknown. So the BRD now requires an evidenced funding route before any
  bid work starts.'
