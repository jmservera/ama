speaker_notes: 'This is a comparison framework, not a scored recommendation. Excel-only improvement may minimize change,
but control fit and the manual baseline still need evidence. The greenfield Power Apps/Dataverse business-platform
option and Azure-led hybrid both need fair, equal-scope appraisal. Tenant fit, licences, workflows and resident
access have not been tested. The Azure-led hybrid is the
  exercise direction for connected workflows and real AI, SQL and Azure evidence; it is not a production decision
  and costs are not measured.

  Ask owners to compare the routes on the same workload, controls, transition risk, accessibility, integration,
  support and whole-life cost. Identify tenant capability, workbook quality, baseline effort and failure fallback.
  Score only when comparable evidence exists; mandatory safety, privacy, resident and approval controls are gates,
  not tradeable points.

  Evidence:

  docs/adrs/0001-azure-architecture.md — Hybrid M365 and Excel transition; Options still to compare; Provisional options
  appraisal (architect illustration is not an approved decision)

  docs/case_study_48_addendum.md — Implementation Options and Provisional Platform Recommendation; EXA-012 / OQ-012

  docs/case_study_48_original.md — Business Challenge (spreadsheets stated; specific workbook failure modes not measured)'
