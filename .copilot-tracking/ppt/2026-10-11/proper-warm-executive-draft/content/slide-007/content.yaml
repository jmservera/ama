speaker_notes: 'Here is the same system as layers. Staff and, later, controlled resident touchpoints use role queues and one
  case view. Beneath that, deterministic workflow rules rank work, route tasks and hold gates, so priority is explainable
  rather than a model''s guess.

  Every action passes the controlled API, which checks identity, case-level access, evidence versions and approvals before
  the case store changes. Case state sits in Azure SQL, evidence in versioned Blob storage, and Excel arrives by validated
  one-way import.

  Bounded AI sits to the side. It receives permitted inputs and returns a cited draft, a typed choice or a flag to a person.
  It has no write credentials, so it can make staff faster without being able to act alone.

  The bottom band is what we still have to prove: least privilege, monitoring, recovery and approval. This is a target design,
  not a deployed topology.


