speaker_notes: 'Eight documented role agents challenged the request: Assets, Programme, Finance, Procurement, Resident
  Engagement, Building Safety, Data and Performance, and the Neighbourhood Housing Officer. Each brought a different
  failure question. Who approves the investment? Who accepts quality? Who owns a pending handoff? What happens when
  a resident cannot use a digital channel? Does faster activity simply move the queue elsewhere?


  These were research instruments using sector-informed hypotheses, not employee interviews or corporate approval.
  The measurement challenge forced us to separate programme change from AI contribution.


  Later, Programme, Finance, Resident Engagement and Data instruments proposed reconciled exercise assumptions.
  The project owner accepted the v0.12 baseline on 10 October. Owner UX feedback separately asked for visible readiness,
  ownership and agent purpose. None of that substitutes for direct staff or resident validation, or acceptance of
  the current candidate.


