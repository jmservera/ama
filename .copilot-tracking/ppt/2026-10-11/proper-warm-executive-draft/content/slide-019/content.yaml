speaker_notes: |-
  Why not fix Excel? We should cost that option; the proposed control mechanisms, not familiarity alone, decide the comparison. Why not Power Platform? Tenant/licensing and operational fit are unverified and require equivalent appraisal before production selection. Why buy AI now? Do not buy an assumed benefit; verify access, terms and scoped authority, then run paired task tests. Why not launch from #58? Narrow observed feasibility is not full workflow/control or human acceptance.

  What is the budget? No new corporate amount is approved. Historical EXA-012 allocated USD450 per month, reviewed at USD360 and paused at USD405; #58 removed that cap only for its rebuild. Each subsequent build needs an effective scoped approval with accrued liabilities. Stop if controls fail, authority is absent or liabilities exceed the agreed envelope. Simplify any AI task that fails net-value testing; keep required real-platform evidence independent.

