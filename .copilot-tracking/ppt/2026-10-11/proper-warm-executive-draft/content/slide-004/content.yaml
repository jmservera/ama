speaker_notes: 'We are proposing one staff-facing retrofit workbench: linked home, building, scheme, work package and
  service cases, with role queues over shared status, evidence, owners, blockers, capacity and finance. It coordinates
  work; it does not replace every source system or create five autonomous agents.

  Deterministic rules control ranking and transitions. Bounded AI drafts, selects or flags; people decide. Azure SQL,
  Blob and a controlled API are the exercise direction. The customer benefit to test is one accountable case and
  next action through accepted handover. Time, rework and completion improvement are not yet measured.

  Actual Azure, SQL and AI are required in subsequent accepted exercise deliveries. This is not a production platform
  selection: Excel-only and M365 options still need comparable appraisal.

  Evidence:

  docs/reference/research/company/agent-request-challenge.md — Purpose and Method; Summary (2026-09-26, role-agent
  hypotheses)

  docs/case_study_48_addendum.md — Subsequent Application Exercise Builds (2026-10-11); Current Learning and Parallel
  Experiment (owner direction; feasibility not benefit)

  docs/prds/proper-warm-retrofit-programme-demonstrator.md — front matter; Executive Summary; CON-009/AC-057 (v0.13.0
  candidate 2026-10-11; historical v0.12.0 accepted 2026-10-10)

  docs/adrs/0001-azure-architecture.md — Exercise Applicability (2026-10-11); Decisions; Hybrid M365 and Excel transition;
  Options still to compare (proposed)

  docs/adrs/0002-pilot-readiness-architecture.md — Exercise Applicability (2026-10-11); Decisions; 1. Durable store
  (proposed readiness design)'
