- {<<: *t, top: 6.7, height: 0.28, text: '13 / FICTIONAL EXA-010/015 / E06 / NO REAL AWARD, COVENANT HEADROOM OR SPENDING AUTHORITY CLAIMED', font_size: 11, font_bold: false}
speaker_notes: |
  For the CEO, this is mission stewardship; for Assets, safe accepted handover. For the CFO, it must also be honest cash exposure.

  This fictional home costs twenty thousand pounds. Its illustrative grant is seven thousand five hundred, leaving twelve thousand five hundred provider funding if received. Before receipt, gross exposure is still twenty thousand. Fully spent contingency raises the envelope to twenty-two thousand and provider exposure to fourteen thousand five hundred.

  Application, award, claim and cash must remain separate. These are exercise figures, not a real budget, grant or liquidity position.

  The workbench needs its own whole-life cost and authority review. Count net effort and cost per accepted outcome, not headline minutes saved.

