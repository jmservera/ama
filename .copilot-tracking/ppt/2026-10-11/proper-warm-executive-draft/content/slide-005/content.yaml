- &b {type: shape, shape: rounded_rectangle, left: 0.65, top: 4.25, width: 5.825, height: 1.7, fill: '#D5E2D4', text: "ADD\nOne shared case, owned transitions,\nevidence and bounded assistance", text_font: Aptos, text_size: 22, text_color: '#183A31', margin_left: 0.22, margin_right: 0.22, margin_top: 0.14, margin_bottom: 0.14, vertical_anchor: middle, alignment: left, auto_size: none, line_spacing: 1.05}
- {<<: *b, left: 6.825, fill: '#E5B96A', text: "KEEP\nExisting teams and suppliers;\nsource systems and Excel reporting"}
- {<<: *t, top: 6.7, height: 0.28, text: '05 / PROPOSED MODERNISATION / E03/E05/E08 / NO HEADCOUNT REDESIGN OR ALL-SYSTEMS MIGRATION', font_size: 11, font_bold: false}
speaker_notes: |
  This is the bold proposal: do not put faster agents on top of invisible work. Make work visible, measurable and explainable so assistance can help safely.

  The expansion is explicit. Alongside the five capabilities, we propose a shared case, owned transitions and evidence. Those are repeated prerequisites, not a cloud-fashion detour. Without them, five assistants can produce five incompatible accounts of the same home.

  This is modernisation of existing work, not a replacement operating model, headcount redesign or all-systems migration. Keep the teams, suppliers and useful source systems. Keep Excel for reporting. Start with one connected home.

  Technology alone creates no crew capacity, consent, money or technical acceptance.

