slide: 5
title: Change the handoffs. Not the whole company.
section: Main executive story
layout: blank
background: {fill: '#173F35'}
elements:
- &t {type: textbox, left: 0.65, top: 0.6, width: 12, height: 0.3, text: 'THE MINIMUM SHARED FOUNDATION FOR FIVE CAPABILITIES', font: Aptos, font_size: 11, font_color: '#F7F2E7', font_bold: true, margin_left: 0, margin_right: 0, margin_top: 0, margin_bottom: 0, word_wrap: true}
