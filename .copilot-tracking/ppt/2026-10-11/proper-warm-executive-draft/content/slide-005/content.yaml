speaker_notes: 'This is the whole product on one page. On the left are the people who touch a retrofit: coordinators, surveyors
  and installers, finance and quality managers, and residents and contractors through controlled touchpoints. On the right
  is where the facts come from today: Excel workbooks, housing and stock data, surveys and evidence, and funding rules.

  In the middle is what we build: one workbench with one linked case per home or work package. Everyone sees the same owner,
  next action and blocker, and the evidence behind a decision.

  It sits beside existing sources and reuses their data through a validated one-way import. It does not replace every system,
  and it does not give residents or contractors open access. Speed and experience gains are mechanisms to test, not measured
  results.


  Evidence:

  docs/prds/proper-warm-retrofit-programme-demonstrator.md - front matter; Executive Summary; CON-009/AC-057 (v0.13.0 candidate
  2026-10-11)

  docs/adrs/0001-azure-architecture.md - Exercise Applicability (2026-10-11); Decisions; Hybrid M365 and Excel transition
  (proposed)

  docs/adrs/0002-pilot-readiness-architecture.md - Exercise Applicability (2026-10-11); Decisions (proposed readiness design)'
