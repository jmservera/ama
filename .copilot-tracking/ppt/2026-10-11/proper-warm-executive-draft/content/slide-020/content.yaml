speaker_notes: |-
  Evidence categories: REQUEST is the immutable case ambition; RESEARCH is sector evidence or role-agent hypothesis; EXERCISE is a selected fictional fixture or historical owner-approved baseline; DIRECTION is the current owner's delivery requirement; PROPOSED is design or evaluation not yet accepted; OBSERVED FEASIBILITY is a precisely pinned recorded service result; UNPROVED is benefit or readiness still lacking evidence.

  All consequential legal adoption requires fresh official-source verification and professional/control-owner approval. v0.12 acceptance on 10 October does not transfer to v0.13. PR #58 evidence is pinned at 5136f192d583a5bf53adeeec4b0f21369b005c9d in maintained main documentation, not imported source or a re-inspected runtime.

  The full capstone guide informed the narrative. A deck cannot establish live delivery, Q&A behaviour, working autonomy, operations or publication floors.   Independent strategist findings are recorded in the tracking review and addressed in this build; a timed rehearsal remains pending. Detailed source/provision/date/status references are in notes and research/evidence-register.md.

