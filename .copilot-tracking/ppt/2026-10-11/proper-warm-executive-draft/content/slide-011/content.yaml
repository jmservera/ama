speaker_notes: |-
  Staff work from role queues showing owner, blocker, evidence and next action. Residents get clear choices, a named contact and safe phone, letter, text, email or officer-assisted routes; no mandatory portal. Contact preference, adjustment and measure consent are separate. Silence is not consent, and hazards reach a human response route outside routine scheduling.
  Contractors receive the agreed scope, schedule and necessary adjustments through approved channels, then return completion evidence. Neither residents nor contractors are assumed to log in to the staff tool; sensitive diagnoses are not shared. These handoffs may improve clarity, but fewer visits, delays or defects are unproved. Accessible staff, resident and contractor co-design/testing remain prerequisites.

  Evidence:
  docs/case_study_48_addendum.md — Owner-Approved Exercise Baseline (2026-10-10); EXA-001/002/004/005/008/010/011/012/013/015/016; Numerical Targets and Attribution (historical accepted exercise assumptions)
  docs/reference/research/ux/proper-warm-prototype-profile-review.md — Owner Usability Feedback (2026-10-07); Proposed Acceptance Checks UX-01 to UX-08 (reported impressions, unexecuted checks)
  docs/reference/research/company/company-profile-research.md — Confirmed Company Information; Modelled Customer Profile; Role and Decision Map (2026-09-26; not-for-profit owner-confirmed, other attributes modelled)
