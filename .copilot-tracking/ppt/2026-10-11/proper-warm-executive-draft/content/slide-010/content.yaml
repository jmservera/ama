speaker_notes: 'Cloud alone does not make this secure. Proposed controls are server-enforced role/case/field rights,
  minimum-necessary model inputs, one API write path, independent human gates, versioned evidence and audit. The AI
  identity cannot write programme state. The exercise uses constructed, non-identifying records.

  No penetration, authorization, cross-case leakage, recovery or privacy assessment is claimed. Verify controls
  against the actual deployment before real data or operations. Narrow Azure SQL/Blob/AI feasibility does not certify
  the target design. The continuing sixty-thousand-home stock and nine-hundred-and-eighty-case programme are generated;
  v0.13 remains pending fresh review and owner acceptance.


