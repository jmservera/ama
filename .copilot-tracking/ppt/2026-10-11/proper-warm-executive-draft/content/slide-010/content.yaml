speaker_notes: |-
  The workbench coordinates the full journey: identify and prioritise the home; assess technical scope and resident choice; confirm funding, competent capacity and human release; then deliver, verify quality, resolve defects, hand over to the resident and close finance with separate evidence.
  Staff can see owner, blocker, next action and returned work across handoffs. A sent task is not an accepted task. The intended outcome is accepted handover, not starts. This is a control mechanism to evaluate on constructed records, not evidence that real work or improvement has occurred.

  Evidence:
  docs/case_study_48_addendum.md — Owner-Approved Exercise Baseline (2026-10-10); EXA-001/002/004/005/008/010/011/012/013/015/016; Numerical Targets and Attribution (historical accepted exercise assumptions)
  docs/prds/proper-warm-retrofit-programme-demonstrator.md — front matter; Executive Summary; CON-009/AC-057 (v0.13.0 candidate 2026-10-11; historical v0.12.0 accepted 2026-10-10)
  docs/reference/research/ux/proper-warm-prototype-profile-review.md — Owner Usability Feedback (2026-10-07); Proposed Acceptance Checks UX-01 to UX-08 (reported impressions, unexecuted checks)
