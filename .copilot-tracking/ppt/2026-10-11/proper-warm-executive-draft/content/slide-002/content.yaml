speaker_notes: 'The original question was which agents to build. The research asked what actually prevents safe,
  accepted completions. Spreadsheet dependence is in the case, but it is not proof that administration is the binding
  constraint. Capital, competent assessors, supplier capacity, access, evidence quality and downstream assurance
  may matter more.


  The role challenge found that every end-to-end agent request mixed deterministic controls, accountable decisions
  and narrower AI tasks. Richer photos, invoices and sensor inputs did not change that division. Better inputs cannot
  create consent or professional acceptance.


  Our conclusion is to build a shared coordination and evidence foundation, then add assistance where comparative
  tests show net benefit. The regulatory material is a dated research set. The current register distinguishes final
  energy policy from proof of a commenced landlord duty. We have not refreshed legal currentness for this pitch.


