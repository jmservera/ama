speaker_notes: |
  Four gates turn ambition into a controlled next step. Sponsor and Assets review the current requirements candidate, assign control owners, and define scope and authority. Programme and Digital then connect the same-home trace on continuing generated data, with actual exercise services and negative-control tests.

  Data, Finance and the CIO require evidence of net task value, whole-life cost, enforceable permissions, accessibility and recovery. The sponsor and owners receive pass, fail, blocked and not-run findings and decide whether to continue, simplify or stop.

  PRD v0.13 needs fresh review and acceptance. Historical v0.12 approval and #58 feasibility do not transfer. Missing authority blocks billable work. A later live pilot requires separate operational, privacy, professional and user approval.

  Evidence:
  docs/case_study_48_addendum.md — EXA-001; Subsequent Application Exercise Builds; Current Learning and Parallel Experiment (2026-10-11).
  docs/prds/proper-warm-retrofit-programme-demonstrator.md — front matter; CON-009/AC-057 (v0.13 candidate).
  docs/adrs/0002-pilot-readiness-architecture.md — Exercise Applicability; Decisions (proposed).
