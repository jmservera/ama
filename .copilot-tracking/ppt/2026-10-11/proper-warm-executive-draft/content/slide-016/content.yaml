speaker_notes: |-
  Gate the next stage around decisions, not service counts. First review and accept the current requirements candidate, name accountable owners, freeze the evidence and test contracts, and record effective scope and spending authority. No missing approval is solved by running another model.

  Prove connected case controls on continuing generated data using actual Azure, SQL and registered inference. Show version-linked write, read and restart evidence, independent decisions and negative permission tests. Unit-test mocks cannot establish delivered application acceptance.

  Then evaluate net task value and engineering readiness, including accessibility, recovery, performance and accrued costs. Finally return a reviewable evidence pack to the owner with pass, fail, blocked and not-run states. The earlier four-week exercise plan was a software delivery scenario, not a physical retrofit programme or unconditional timetable for this candidate. Only subsequent operational appraisal, real user research and formal control-owner approval could justify a live pilot.

  Evidence:
  docs/case_study_48_addendum.md — Owner-Approved Exercise Baseline (2026-10-10); EXA-001/002/004/005/008/010/011/012/013/015/016; Numerical Targets and Attribution (historical accepted exercise assumptions)
  docs/case_study_48_addendum.md — Subsequent Application Exercise Builds (2026-10-11); Current Learning and Parallel Experiment (owner direction; feasibility not benefit)
  docs/prds/proper-warm-retrofit-programme-demonstrator.md — front matter; Executive Summary; CON-009/AC-057 (v0.13.0 candidate 2026-10-11; historical v0.12.0 accepted 2026-10-10)
  docs/adrs/0001-azure-architecture.md — Exercise Applicability (2026-10-11); Decisions; Hybrid M365 and Excel transition; Options still to compare (proposed)
