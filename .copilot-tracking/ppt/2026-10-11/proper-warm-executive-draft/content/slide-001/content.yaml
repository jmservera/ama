speaker_notes: 'Proper Warm began with a request to coordinate a complex retrofit programme across sixty thousand
  homes using five agents. The offer is one staff-facing workbench linking cases, accountable owners and evidence
  through to accepted handover. Our ambition is warmer homes with a clear next step for every home, not faster
  administration alone.


  Today I am asking the council to endorse preparation of a gated evidence-stage proposal, not a production rollout
  or accelerated capital commitment.
  For the CEO, that is confidence in the mission. For Assets, it is a defensible route to accepted handover. For
  Finance, it is visibility of commitments, exposure and evidence before money moves. The promise is one programme,
  one evidence trail, human control. The measurable benefits still have to be earned.


  Evidence:

  docs/case_study_48_original.md — Business Challenge; Agentic Architecture Brief; Expected Outcomes (2026-09-10,
  immutable request)

  docs/case_study_48_addendum.md — Business Challenge; Regulatory Evidence and Service Design; Proper Warm at Proper
  North Homes (2026-10-11, maintained proposal)

  docs/case_study_48_addendum.md — Subsequent Application Exercise Builds (2026-10-11); Current Learning and Parallel
  Experiment (owner direction; feasibility not benefit)

  docs/reference/research/company/company-profile-research.md — Confirmed Company Information; Modelled Customer
  Profile; Role and Decision Map (2026-09-26; not-for-profit owner-confirmed, other attributes modelled)'
