speaker_notes: 'Take one working day for a coordinator. Today, in a workbook-led process, finding a case can mean searching
  several workbooks and inboxes. Knowing what happens next can mean asking a colleague. Proving a decision can mean hunting
  for the latest file, and updating a resident or contractor can mean rewriting the same status by hand. These are sector-informed
  hypotheses about Excel, not findings about Proper North Homes.

  With the workbench, the same person opens one linked case that shows the owner and blocker, sees a ranked next action, finds
  evidence and approvals attached, and reviews a cited draft update before sending it.

  Speed comes from fewer searches, fewer chases and fewer retyped updates. We will test it by timing find-the-case, chase
  counts and rework in a paired exercise against the current route. No time saving is measured yet, and residents and contractors
  benefit through clearer, more consistent updates that staff still approve.


