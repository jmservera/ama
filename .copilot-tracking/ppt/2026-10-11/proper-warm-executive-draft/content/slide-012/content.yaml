speaker_notes: 'Separate two tests: does the coordinated programme improve safe accepted handovers, and does a specific
  AI task outperform the same workflow without it? Compare matched localities for programme outcomes and paired,
  identical tasks for capability value. Include incomplete, paused and withdrawn cases, shared resources and
  displacement. Measure errors, review effort, delay, cost and uncertainty; protect safety, consent, equity and quality.

  These are proposed comparisons, not results. A negative AI finding means retain the simpler path and report it.


