- {<<: *t, top: 6.7, height: 0.28, text: '12 / NARROW OBSERVED FEASIBILITY ≠ TASK BENEFIT OR FULL ACCEPTANCE / E07/E11', font_size: 11, font_bold: false}
speaker_notes: |
  Give AI a bounded task, not an office of authority. A decision model may select among supplied, source-bound candidates when verified task fit supports it. It must allow no-match or uncertainty. A generative model may assemble a cited narrative from permitted evidence.

  Staff check required fields and own the decision. Priority policy, consent, technical acceptance, claims, quality and payment are never AI-owned.

  Pinned #58 records source-bound EPC selection and cited generation feasibility. That does not establish calibration, broader screening or net benefit.

  If review and correction erase the benefit, keep the simpler path. Real inference is exercise evidence; usefulness needs a separate test.

