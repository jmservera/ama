speaker_notes: 'The case says spreadsheets coordinate the work; it does not prove repeated reconciliation or evidence
  reassembly. Measure before claiming staff pain, saved time or fewer errors.

  The proposed improvement mechanism is one linked case, named handoff owner and independently checked transition.
  How much better it is remains unknown until equal tasks are compared for effort, errors, rework and accepted
  outcomes. Do not claim Excel cannot be hardened.

  Manage change in stages: co-design with staff, profile workbook owners, then shadow one-way imports. Run a short,
  time-boxed parallel period with
  named editors, quarantine ownership and owner-agreed reconciliation and exit thresholds. Train through role-based
  task walkthroughs and provide named support. After sign-off, tested rollback and an out-of-hours hazard route, the
  workbench becomes the write path and Excel an API-fed read-only report. No permanent dual write.

  Compare identical tasks and outcomes, including review, correction, chase, errors and accepted handovers. Tenant,
  workbook quality, staff readiness and results remain unknown.


