speaker_notes: |-
  This fictional fixture shows why Finance sees gross cash, not an assumed grant offset: GBP20,000 base cost, GBP7,500 illustrative grant and GBP12,500 provider base funding. If contingency is spent, the gross envelope is GBP22,000 and provider exposure GBP14,500. Before grant cash arrives, exposure is still GBP20,000.
  These are exercise assumptions, not company budget, award terms or liquidity. Technology requires its own authority and stop conditions. Technology whole-life cost remains unassessed and belongs in the return pack. Measure effort and cost per accepted outcome before treating time saved as cashable benefit.

