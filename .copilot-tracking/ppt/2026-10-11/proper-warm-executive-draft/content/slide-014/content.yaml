speaker_notes: 'The decision requested today is limited: endorse preparation of a gated evidence-stage proposal.
  It does not authorize procurement, deployment, delivery spend or production adoption. Ask the CEO to nominate an
  executive sponsor, Assets to nominate workflow and control owners, and Finance to define how affordability and
  authority will be reviewed. Confirm the actual delegated roles rather than assuming them.

  Return at a date the council agrees with freshly reviewed requirements, an unscored comparable options appraisal,
  scoped cost and authority, acceptance evidence and explicit stop conditions. The evidence must show whether the
  connected workflow works, whether assistance earns its cost, and which gates remain unmet. If value is absent,
  simplify. If controls fail, stop and repair.


  Our ambition remains bold: move from chasing spreadsheets to warmer homes through one programme, one evidence trail
  and human control. The case is accountable handovers, not AI theatre.


