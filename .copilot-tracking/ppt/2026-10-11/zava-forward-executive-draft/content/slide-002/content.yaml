speaker_notes: 'The five requests follow a home: prioritise, assess, fund, coordinate,
  verify. The original asks for recommendations, drafts, coordination and quality
  flags while preserving investment approval and resident consent.


  We are not dismissing that request. We are asking what must be true for each capability
  to be useful. A better draft cannot unlock a missing survey; a schedule cannot manufacture
  a competent crew.


  Doubled delivery, grant capture and lower bills are original ambitions, not demonstrated
  outcomes. Accepted handover is the endpoint that keeps all five capabilities honest.


  Evidence:

  docs/case_study_48_original.md — Transformation Objective; Agentic Architecture
  Brief; Expected Outcomes; Business Case (2026-09-10).

  docs/reference/research/company/pilot-measurement-challenge.md — Summary (2026-09-26,
  research hypotheses).

  '
