speaker_notes: 'Measurable work does not begin with a dashboard. It begins with a
  contract for each step.


  Record the case owner and the person accepting the handoff. Give the work a named
  state. Capture entry, exit and pause timestamps, a coded blocker, the next action,
  and the evidence version behind acceptance.


  The sender retains chase responsibility until the receiver accepts. Changed evidence
  returns only dependent decisions for review. Safety concerns take a separate human
  response route.


  Now the team can distinguish waiting for a survey from waiting for consent or capacity.
  Leaders can see where effort accumulates. Agree definitions first and count recording
  effort too; visibility is a proposed mechanism, not a saving.


  Evidence:

  docs/reference/research/company/agent-request-challenge.md — Summary; Programme
  supervisor (2026-09-26).

  docs/reference/research/company/pilot-measurement-challenge.md — Freeze Before Measurement;
  Analysis Rules (2026-09-26).

  docs/case_study_48_addendum.md — EXA-002/008/013 (historical exercise assumptions,
  2026-10-10).

  '
