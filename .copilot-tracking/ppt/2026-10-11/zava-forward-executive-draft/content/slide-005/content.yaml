speaker_notes: 'This is the bold proposal: do not put faster agents on top of invisible
  work. Make work visible, measurable and explainable so assistance can help safely.


  The expansion is explicit. Alongside the five capabilities, we propose a shared
  case, owned transitions and evidence. Those are repeated prerequisites, not a cloud-fashion
  detour. Without them, five assistants can produce five incompatible accounts of
  the same home.


  This is modernisation of existing work, not a replacement operating model, headcount
  redesign or all-systems migration. Keep the teams, suppliers and useful source systems.
  Keep Excel for reporting. Start with one connected home.


  Technology alone creates no crew capacity, consent, money or technical acceptance.


