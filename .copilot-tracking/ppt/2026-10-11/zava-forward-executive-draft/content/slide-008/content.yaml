speaker_notes: 'At that appointment, two realities meet: a resident''s informed choice
  and a supplier''s actual capacity. Neither is a prediction for an agent to invent.


  Residents need clear options, a named contact and safe phone, letter or officer-assisted
  routes. No compulsory portal. Contact preference, accessibility adjustment and consent
  to a measure are separate records. Silence is not consent, and no-access is not
  automatically refusal.


  Contractors need agreed scope, competence, materials and necessary adjustments—not
  sensitive diagnoses. A named liaison owns the handoff through approved channels.


  AI can help prepare an update or suggest an available slot. Staff still review and
  act. Real co-design must test clarity and burden; fewer failed visits remain unmeasured.


