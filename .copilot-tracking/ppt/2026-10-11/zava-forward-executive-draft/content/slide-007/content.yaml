speaker_notes: 'Follow one fictional home. Its EPC sources conflict. Rather than invent
  an answer, the case holds the dependent decision and names a resolver. After correction,
  approved rules establish priority.


  The assessor supplies observations; the coordinator reviews the design. The resident
  chooses the measures through supported contact. Finance checks funding, and a competent
  crew is committed before a person releases work.


  The contractor returns versioned evidence. Independent quality review finds a defect
  and returns it to an owner. Only after correction and acceptance does resident handover
  proceed. Financial closure has its own evidence; it is not inferred from installation.


  The win to prove is continuity: no lost owner, silent exception or unexplained acceptance.
  This is an exercise story, not live proof.


  Evidence:

  docs/case_study_48_addendum.md — EXA-002/003/005/007/008/015; Four-Week Plan and
  Tribunal Defence (2026-10-10 exercise).

  docs/prds/proper-warm-retrofit-programme-demonstrator.md — Executive Summary; Exercise
  Acceptance Contract (v0.13 candidate).


  Demo/recovery cue (not spoken): show actual executed scope in under two minutes;
  if unavailable, use this illustrative trace, never call it proof.

  '
