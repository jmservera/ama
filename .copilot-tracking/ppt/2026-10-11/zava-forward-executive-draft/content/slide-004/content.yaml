speaker_notes: 'Three examples make the scope change concrete.


  You asked for ranking. The challenge found that ranking weights are investment policy,
  and eligibility is a rules question. If a model guesses either, we cannot justify
  who waits. Build an approved cohort policy, reproducible rules and field-level sources;
  let AI reconcile or explain, not set priority.


  You asked for scheduling. The challenge found that a viable appointment needs committed
  competent capacity and informed resident choice. A calendar invitation supplies
  neither. Build capacity and measure-choice records with a named liaison; AI may
  suggest slots inside those boundaries.


  You asked for grant drafts. The challenge found that claimable evidence and the
  ledger come first. Application, award, claim and cash are different states. Build
  accepted evidence and independent financial review; AI may assemble the sourced
  draft.


  These are hypotheses to validate, but each exposes a prerequisite the requested
  capability cannot safely skip.


  Evidence:

  docs/reference/research/company/agent-request-challenge.md — Summary; Stock Prioritisation
  Agent; Grant and Funding Agent; Contractor and Resident Coordination (2026-09-26).

  '
