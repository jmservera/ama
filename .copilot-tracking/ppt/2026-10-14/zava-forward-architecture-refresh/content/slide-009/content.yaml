speaker_notes: "Message / evidence limit / planned script:\nSLIDE 09 - Show the decision trace, not just\
  \ an AI explanation.\nTopic sentinel: decision trace\nMessage: source, rule, reviewer and change history\
  \ make a decision inspectable.\nStatus: strategist-recommended proposal; refreshed 14 October 2026.\n\
  \n\"A generated explanation cannot substitute for source and approval\n  records. Retain the applicable\
  \ versions, reason, reviewer and timestamp.\n  Changed sources invalidate dependent reviews. Legal and\
  \ professional\n  interpretations need accountable review before rules change; the repository\n  is\
  \ dated evidence, not a self-updating legal authority. Current assistant\n  citations bind captured\
  \ categories/metadata, not proof every conclusion is\n  supported by a document passage.\"\n* Transition:\
  \ \"The workbench sits beside the systems that supply those facts.\"\n\nSources — workspace-relative\
  \ paths, section and evidence status; as read 14 October 2026:\nS02: docs/case_study_48_addendum.md,\
  \ Business Challenge; Executive Assessment; Digital Foundation; Where Agents Fit; Recommended Executive\
  \ Decision. Status: Maintained 14 October synthesis and proposed controls; bottleneck/outcomes not verified\
  \ company findings.\nS07: docs/prds/zava-forward-retrofit-programme-demonstrator.md, v0.14 front matter;\
  \ component contracts; threat model; Five Reactive and Proactive Assistants; orchestration; evaluation;\
  \ current handoff. Status: Current candidate, 47 FRs/61 ACs; fresh requirements review and amended owner\
  \ acceptance open; CON-009/AC-057 full acceptance not passed.\nS11: mvp/README.md, Honest limits; Five\
  \ retrofit assistants; Operator authority; current delivery paragraphs; mvp/zavaforward_mvp/assistants.py,\
  \ REGISTRY/RULES/capture/eligible/review. Status: Source and documented implementation; captured metadata/category\
  \ citations, not unrestricted document reading, human source review or semantic entailment.\n\nPlanned\
  \ allocation: 30 seconds; not rehearsed.\n\nREFRESH BASELINE / UN SPOKEN REFERENCE:\nRefresh documentation\
  \ intake: f94f53a56c36d38ec36f7f662595912084571380. Architecture source: 062434a1fedbf6a87d1374c767c2bf0a11491ab6.\
  \ Runtime source: cd14b3b379026a87ebfa3e9058ac10c0df7888eb. Historical cabe05c context below is not\
