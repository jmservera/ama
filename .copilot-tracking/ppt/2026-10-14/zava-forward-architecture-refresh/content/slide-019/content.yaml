speaker_notes: "Message / evidence limit / planned script:\nSLIDE 19 - One runtime. Proposals are not\
  \ domain approvals.\nTopic sentinel: technical limits\nMessage: disclose runtime limits and the evidence\
  \ required for stronger claims.\nStatus: strategist-recommended proposal; refreshed 14 October 2026.\n\
  \n\"Threats include source injection, cross-role leakage, stale\n  approvals and duplicate or lost transitions.\
  \ Application controls—not a\n  prompt alone—constrain proposals. SQL controls claim/lease fences and\
  \ finite\n  shared liabilities; timeouts do not mean zero usage and billing is not\n  exactly once.\
  \ Local SQL/browser tests and deployed content-restart receipts\n  are different evidence. No measured\
  \ Azure scale load, full restore,\n  production SLO or externally anchored whole-system audit is established.\n\
  \  Present runtime still shares in-memory domain mechanisms described in\n  the MVP limits; proposed\
  \ queue workers/private topology remain distinct.\n  Decision 1 is a separate candidate-selection/screening\
  \ design with historical\n  narrow evidence; it did not power the five new GPT proposal calls.\n  Held-out\
  \ calibration, alternatives on quality/latency/cost and independent\n  human source labels remain required.\
  \ Structured trigger predicates do not\n  establish autonomous reasoning; A7 is not claimed complete.\"\
  \n\nSources — workspace-relative paths, section and evidence status; as read 14 October 2026:\nS07:\
  \ docs/prds/zava-forward-retrofit-programme-demonstrator.md, v0.14 front matter; component contracts;\
  \ threat model; Five Reactive and Proactive Assistants; orchestration; evaluation; current handoff.\
  \ Status: Current candidate, 47 FRs/61 ACs; fresh requirements review and amended owner acceptance open;\
  \ CON-009/AC-057 full acceptance not passed.\nS08: docs/adrs/0002-pilot-readiness-architecture.md, Five-Assistant\
  \ Exercise Runtime; Fresh Ledger and Synthetic Coverage Learning; current delta. Status: Current lean\
  \ proposal runtime, explicit reset, image/source/revision-linked service proof; proposed readiness estate\
