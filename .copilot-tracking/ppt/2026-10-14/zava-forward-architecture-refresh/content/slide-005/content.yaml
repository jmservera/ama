speaker_notes: "Message / evidence limit / planned script:\nSLIDE 05 - Change the handoffs, not the whole\
  \ company.\nTopic sentinel: shared foundation\nMessage: modernise coordination around existing people\
  \ and systems.\nStatus: strategist-recommended proposal; refreshed 14 October 2026.\n\n\"The proposal\
  \ is a programme control and evidence layer, not\n  replacement of the housing organisation. Keep useful\
  \ systems, teams and\n  suppliers. Introduce an owned case and a controlled transition from source\n\
  \  spreadsheets to API-fed reporting. Neither the integration nor the reduction\n  in duplicate effort\
  \ is accepted simply because it appears in the design.\"\n* Transition: \"A handoff becomes useful when\
  \ its contract is explicit.\"\n\nSources — workspace-relative paths, section and evidence status; as\
  \ read 14 October 2026:\nS02: docs/case_study_48_addendum.md, Business Challenge; Executive Assessment;\
  \ Digital Foundation; Where Agents Fit; Recommended Executive Decision. Status: Maintained 14 October\
  \ synthesis and proposed controls; bottleneck/outcomes not verified company findings.\nS07: docs/prds/zava-forward-retrofit-programme-demonstrator.md,\
  \ v0.14 front matter; component contracts; threat model; Five Reactive and Proactive Assistants; orchestration;\
  \ evaluation; current handoff. Status: Current candidate, 47 FRs/61 ACs; fresh requirements review and\
  \ amended owner acceptance open; CON-009/AC-057 full acceptance not passed.\nS12: docs/adrs/0001-azure-architecture.md,\
  \ Hybrid M365 and Excel transition; Options still to compare; provisional appraisal. Status: Proposed\
  \ transition/full topology and historical illustration, not current deployment or scored customer platform\
  \ choice.\n\nPlanned allocation: 25 seconds; not rehearsed.\n\nREFRESH BASELINE / UN SPOKEN REFERENCE:\n\
  Refresh documentation intake: f94f53a56c36d38ec36f7f662595912084571380. Architecture source: 062434a1fedbf6a87d1374c767c2bf0a11491ab6.\
  \ Runtime source: cd14b3b379026a87ebfa3e9058ac10c0df7888eb. Historical cabe05c context below is not\
  \ the current runtime or this documentation intake.\nCurrent five assistants are modules in ONE Python\
  \ API Container App, not five microservices or the deferred queue-worker estate. Direct Azure OpenAI;\
  \ no deployed Foundry Agent Service. SQL owns domain/proposal state, dedupe, reservations and fenced\
  \ leases. Inference is outside database locks; the provider has no DB/workflow credentials. Accepting\
  \ a proposal changes proposal/audit state, never resident, professional, work-release, quality or Finance\
  \ approval.\nNormal five-assistant authority is absent; proactive OFF. This does not disable every legacy\
  \ AI draft route. Ready = generated, unreviewed. Five operator paths, five calls, 6884 tokens, 15 ledger\
  \ events and full SQL content/restart proof are technical observations only, not staff-browser, human\
  \ source, semantic or value acceptance. Restart is not restore acceptance.\nDevelopment public-network\
  \ exceptions coexist with configured private controls; PaaS is not VNet-hosted. Source-configured diagnostics\
  \ are not full app tracing. External immutable audit digest anchoring is unimplemented. M365/import/queue\
  \ workers are conditional or deferred. User.Read own-photo permission is not Sites.Selected plus a site\
  \ grant. SharePoint topology parameter is not an implemented adapter. Front Door Premium/WAF is not\
  \ deployed.\nTokens: separate private Blob; daily 03:00 UTC renewal of a five-day user-delegation SAS;\
  \ one vault secret write, distinct maintenance identity, no browser token retrieval. Budget 80% actual/100%\
  \ forecast notifications are not a hard cap. Managed-identity ACR image pull/operator build-deploy is\
  \ distinct from CI tests/scan/SBOM, not automatic Azure deployment.\nThe owner explicitly reauthorised\
  \ synthetic ledger recreation on 14 October; previous exercise audit/recommendations reset, not an unchanged\
  \ migration. Retained 60,000-stock lineage; 980 cases, 38 booked visits and 11 private staff bindings\
  \ are aggregate fixture counts only. No private identifiers are reproduced. Historical Decision 1 is\
  \ not a current five-assistant runtime dependency. Finance fixtures and 20%/25% benefits are hypotheses,\
  \ not measured success. No new legal currentness, expenditure, rollout or production approval.\n\nRetained\
  \ slide10 context, source authority and proposed integration (not delivered):\nSLIDE 10 — One workbench\
  \ beside the systems you keep.\nTopic sentinel: system context\nMessage: retain source ownership while\
  \ connecting case work.\nStatus: strategist-recommended proposal; refreshed 14 October 2026.\n\n\"The\
  \ arrow is from source material into validated intake, not an\n  uncontrolled write-back loop. The case\
  \ connects home, building and package\n  context with roles and evidence. Residents and suppliers need\
  \ supported,\n  scoped exchange, not open access to the internal staff workbench.\n  Housing/repairs\
  \ integrations, M365 document channels and import transition\n  remain proposals or unverified. An integration\
  \ picture is not a deployed\n  connection receipt.\"\n* Transition: \"The API is the authority boundary,\
