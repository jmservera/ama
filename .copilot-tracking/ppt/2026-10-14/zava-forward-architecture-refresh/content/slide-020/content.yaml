speaker_notes: "Message / evidence limit / planned script:\nSLIDE 20 - Council challenge: the objections\
  \ we welcome.\nTopic sentinel: council challenge\nMessage: defend the recommendation without hiding\
  \ reversal conditions.\nStatus: strategist-recommended proposal; refreshed 14 October 2026.\n\n\"Restate\
  \ the challenge before answering. Excel improvement is a\n  fair comparator, not a straw man. Power\
  \ Apps/Dataverse would be greenfield;\n  company tenant/licensing/support fit is unverified. Azure is\
  \ the exercise\n  choice, not proof of the best customer investment. Five proposals prove\n  integration,\
  \ not five approved agents running a service. No new budget is\n  approved here; cost includes review\
  \ and operational burden. Choose the\n  simpler path when assistance adds no net value. Unknown answers\
  \ get an owner\n  and evidence route, not a confident guess.\"\n\nSources — workspace-relative paths,\
  \ section and evidence status; as read 14 October 2026:\nS02: docs/case_study_48_addendum.md, Business\
  \ Challenge; Executive Assessment; Digital Foundation; Where Agents Fit; Recommended Executive Decision.\
  \ Status: Maintained 14 October synthesis and proposed controls; bottleneck/outcomes not verified company\
  \ findings.\nS03: docs/reference/research/company/company-profile-research.md, Confirmed Company Information;\
  \ Role and Decision Map; Priority Company Gaps; Evidence Limitations. Status: Owner-confirmed not-for-profit;\
  \ modelled company/resident/finance attributes are not company facts or delegations.\nS05: docs/reference/research/company/pilot-measurement-challenge.md,\
  \ Owner Decision; Proposed Measurement Design; Freeze/Analysis; Guardrails. Status: Proposed comparisons\
  \ and protected outcomes, not executed experiments.\nS07: docs/prds/zava-forward-retrofit-programme-demonstrator.md,\
  \ v0.14 front matter; component contracts; threat model; Five Reactive and Proactive Assistants; orchestration;\
  \ evaluation; current handoff. Status: Current candidate, 47 FRs/61 ACs; fresh requirements review and\
  \ amended owner acceptance open; CON-009/AC-057 full acceptance not passed.\nS09: infra/README.md, Five-assistant\
  \ version: current handover. Status: Exact serving/source/model/SQL/restart receipt and authority-off\
  \ state, 14 October; no fresh cloud inspection in this task.\nS10: .copilot-tracking/reviews/logs/2026-10-14/five-assistant-live-delivery-review.md,\
  \ Completed Work; Validation; RV-001/RV-002; Outcome. Status: Technical Review Complete / Residual work,\
  \ not blanket product conformance.\nS11: mvp/README.md, Honest limits; Five retrofit assistants; Operator\
  \ authority; current delivery paragraphs; mvp/zavaforward_mvp/assistants.py, REGISTRY/RULES/capture/eligible/review.\
  \ Status: Source and documented implementation; captured metadata/category citations, not unrestricted\
  \ document reading, human source review or semantic entailment.\nS12: docs/adrs/0001-azure-architecture.md,\
  \ Hybrid M365 and Excel transition; Options still to compare; provisional appraisal. Status: Proposed\
  \ transition/full topology and historical illustration, not current deployment or scored customer platform\
  \ choice.\n\nOptional appendix, outside the planned 795-second main route.\n\nREFRESH BASELINE / UN\
  \ SPOKEN REFERENCE:\nRefresh documentation intake: f94f53a56c36d38ec36f7f662595912084571380. Architecture\
  \ source: 062434a1fedbf6a87d1374c767c2bf0a11491ab6. Runtime source: cd14b3b379026a87ebfa3e9058ac10c0df7888eb.\
  \ Historical cabe05c context below is not the current runtime or this documentation intake.\nCurrent\
  \ five assistants are modules in ONE Python API Container App, not five microservices or the deferred\
  \ queue-worker estate. Direct Azure OpenAI; no deployed Foundry Agent Service. SQL owns domain/proposal\
  \ state, dedupe, reservations and fenced leases. Inference is outside database locks; the provider has\
  \ no DB/workflow credentials. Accepting a proposal changes proposal/audit state, never resident, professional,\
  \ work-release, quality or Finance approval.\nNormal five-assistant authority is absent; proactive OFF.\
  \ This does not disable every legacy AI draft route. Ready = generated, unreviewed. Five operator paths,\
  \ five calls, 6884 tokens, 15 ledger events and full SQL content/restart proof are technical observations\
  \ only, not staff-browser, human source, semantic or value acceptance. Restart is not restore acceptance.\n\
  Development public-network exceptions coexist with configured private controls; PaaS is not VNet-hosted.\
  \ Source-configured diagnostics are not full app tracing. External immutable audit digest anchoring\
  \ is unimplemented. M365/import/queue workers are conditional or deferred. User.Read own-photo permission\
  \ is not Sites.Selected plus a site grant. SharePoint topology parameter is not an implemented adapter.\
  \ Front Door Premium/WAF is not deployed.\nTokens: separate private Blob; daily 03:00 UTC renewal of\
  \ a five-day user-delegation SAS; one vault secret write, distinct maintenance identity, no browser\
  \ token retrieval. Budget 80% actual/100% forecast notifications are not a hard cap. Managed-identity\
  \ ACR image pull/operator build-deploy is distinct from CI tests/scan/SBOM, not automatic Azure deployment.\n\
  The owner explicitly reauthorised synthetic ledger recreation on 14 October; previous exercise audit/recommendations\
  \ reset, not an unchanged migration. Retained 60,000-stock lineage; 980 cases, 38 booked visits and\
  \ 11 private staff bindings are aggregate fixture counts only. No private identifiers are reproduced.\
  \ Historical Decision 1 is not a current five-assistant runtime dependency. Finance fixtures and 20%/25%\
  \ benefits are hypotheses, not measured success. No new legal currentness, expenditure, rollout or production\
  \ approval.\n\nSpoken return: That is the current boundary; the decision remains which evidence gate\
  \ to resolve next.\nQuestion routes: current runtime19; equivalent options22; operations23; deferred\
  \ topology24. Listen/restate/answer/concede/assign unknown owner, then return18. No actual audience\
