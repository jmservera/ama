  \ the objections we welcome.\nWhy not improve Excel?\nTest equal scope and controls.\nWhy not launch\
  \ now?\nHuman, semantic and value gates open.\nWhat budget?\nNo new commitment; whole-life appraisal.\n\
  What if AI fails?\nManual workflow remains; simplify.\nUnknown answers get an owner and evidence route,\
