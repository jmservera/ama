speaker_notes: "Message / evidence limit / planned script:\nSLIDE 08 - A resident is not a scheduling\
  \ variable.\nTopic sentinel: dignity/capacity\nMessage: choice, supported contact and real capacity\
  \ precede release.\nStatus: strategist-recommended proposal; refreshed 14 October 2026.\n\n\"Let us\
  \ understand what residents and staff need before calling\n  a journey usable. No compulsory portal.\
  \ Disclosed adjustments are not a\n  licence to share diagnoses. Staff review communications and own\
  \ exceptions;\n  the service does not automatically send, book or instruct. Missed access\n  calls for\
  \ investigation, not inferred withdrawal or deprioritisation.\n  Direct human research and accessibility\
  \ acceptance remain outstanding.\"\n* Transition: \"Trust also needs an explanation another person can\
  \ inspect.\"\n\nSources — workspace-relative paths, section and evidence status; as read 14 October\
  \ 2026:\nS02: docs/case_study_48_addendum.md, Business Challenge; Executive Assessment; Digital Foundation;\
  \ Where Agents Fit; Recommended Executive Decision. Status: Maintained 14 October synthesis and proposed\
  \ controls; bottleneck/outcomes not verified company findings.\nS06: docs/case_study_48_addendum.md,\
  \ EXA-002/003/004/005/007/008/010/011/012/013/015; Numerical Targets and Attribution; Subsequent Application\
  \ Exercise Builds. Status: Historical selected exercise assumptions; explicitly fictional costs/terms,\
  \ not budgets, awards or current open authority.\nS07: docs/prds/zava-forward-retrofit-programme-demonstrator.md,\
  \ v0.14 front matter; component contracts; threat model; Five Reactive and Proactive Assistants; orchestration;\
  \ evaluation; current handoff. Status: Current candidate, 47 FRs/61 ACs; fresh requirements review and\
  \ amended owner acceptance open; CON-009/AC-057 full acceptance not passed.\nS10: .copilot-tracking/reviews/logs/2026-10-14/five-assistant-live-delivery-review.md,\
  \ Completed Work; Validation; RV-001/RV-002; Outcome. Status: Technical Review Complete / Residual work,\
  \ not blanket product conformance.\n\nPlanned allocation: 40 seconds; not rehearsed.\n\nREFRESH BASELINE\
  \ / UN SPOKEN REFERENCE:\nRefresh documentation intake: f94f53a56c36d38ec36f7f662595912084571380. Architecture\
  \ source: 062434a1fedbf6a87d1374c767c2bf0a11491ab6. Runtime source: cd14b3b379026a87ebfa3e9058ac10c0df7888eb.\
  \ Historical cabe05c context below is not the current runtime or this documentation intake.\nCurrent\
  \ five assistants are modules in ONE Python API Container App, not five microservices or the deferred\
  \ queue-worker estate. Direct Azure OpenAI; no deployed Foundry Agent Service. SQL owns domain/proposal\
  \ state, dedupe, reservations and fenced leases. Inference is outside database locks; the provider has\
  \ no DB/workflow credentials. Accepting a proposal changes proposal/audit state, never resident, professional,\
  \ work-release, quality or Finance approval.\nNormal five-assistant authority is absent; proactive OFF.\
  \ This does not disable every legacy AI draft route. Ready = generated, unreviewed. Five operator paths,\
  \ five calls, 6884 tokens, 15 ledger events and full SQL content/restart proof are technical observations\
  \ only, not staff-browser, human source, semantic or value acceptance. Restart is not restore acceptance.\n\
  Development public-network exceptions coexist with configured private controls; PaaS is not VNet-hosted.\
  \ Source-configured diagnostics are not full app tracing. External immutable audit digest anchoring\
  \ is unimplemented. M365/import/queue workers are conditional or deferred. User.Read own-photo permission\
  \ is not Sites.Selected plus a site grant. SharePoint topology parameter is not an implemented adapter.\
  \ Front Door Premium/WAF is not deployed.\nTokens: separate private Blob; daily 03:00 UTC renewal of\
  \ a five-day user-delegation SAS; one vault secret write, distinct maintenance identity, no browser\
  \ token retrieval. Budget 80% actual/100% forecast notifications are not a hard cap. Managed-identity\
  \ ACR image pull/operator build-deploy is distinct from CI tests/scan/SBOM, not automatic Azure deployment.\n\
  The owner explicitly reauthorised synthetic ledger recreation on 14 October; previous exercise audit/recommendations\
  \ reset, not an unchanged migration. Retained 60,000-stock lineage; 980 cases, 38 booked visits and\
  \ 11 private staff bindings are aggregate fixture counts only. No private identifiers are reproduced.\
  \ Historical Decision 1 is not a current five-assistant runtime dependency. Finance fixtures and 20%/25%\
  \ benefits are hypotheses, not measured success. No new legal currentness, expenditure, rollout or production\
  \ approval.\n\nSlot prerequisite: committed competent capacity plus resident measure-specific choice.\
  \ A proposed slot is not consent.\n\nRETAINED BASELINE VISIBLE COPY / TRACEABILITY, UNSPOKEN:\nHistorical\
  \ wording below is retained, not promoted to current fact or permission. Current oracle/status and refreshed\
  \ visible copy govern. In particular, old 'gates OPEN' meant outstanding acceptance, not permission;\
  \ Excel reporting is a conditional intended transition, not delivered integration.\nA resident is not\
  \ a scheduling variable.\nResident\nClear options.\nSafe phone, letter or assisted route.\nMeasure-specific\
  \ choice.\nDelivery\nCommitted crew, competence,\nmaterials and named liaison.\nPreferences ≠ consent.\
  \ Silence/no-access ≠ refusal.\nHuman hazard route — never wait for AI."
