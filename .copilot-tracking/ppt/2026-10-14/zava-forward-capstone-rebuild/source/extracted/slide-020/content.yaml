speaker_notes: 'Why not fix Excel? We should cost that option; the proposed control
  mechanisms, not familiarity alone, decide the comparison. Why not Power Platform?
  Tenant/licensing and operational fit are unverified and require equivalent appraisal
  before production selection. Why buy AI now? Do not buy an assumed benefit; verify
  access, terms and scoped authority, then run paired task tests. Why not launch from
  #58? Narrow observed feasibility is not full workflow/control or human acceptance.


  What is the budget? No new corporate amount is approved. Historical EXA-012 allocated
  USD450 per month, reviewed at USD360 and paused at USD405; #58 removed that cap
  only for its rebuild. Each subsequent build needs an effective scoped approval with
  accrued liabilities. Stop if controls fail, authority is absent or liabilities exceed
  the agreed envelope. Simplify any AI task that fails net-value testing; keep required
  real-platform evidence independent.


  Evidence:

  docs/reference/research/company/pilot-measurement-challenge.md — Summary; Owner
  Decision, 2026-09-26; Proposed Measurement Design (2026-09-26, proposed comparisons)

  docs/case_study_48_addendum.md — Owner-Approved Exercise Baseline (2026-10-10);
  EXA-001/002/004/005/008/010/011/012/013/015/016; Numerical Targets and Attribution
  (historical accepted exercise assumptions)

  docs/case_study_48_addendum.md — Subsequent Application Exercise Builds (2026-10-11);
  Current Learning and Parallel Experiment (owner direction; feasibility not benefit)

  docs/adrs/0001-azure-architecture.md — Exercise Applicability (2026-10-11); Decisions;
  Hybrid M365 and Excel transition; Options still to compare (proposed)

  docs/ideas/typesafe-system-one-agent-fit.md — Observed Feasibility and Parallel
  Value Experiment (2026-10-11); Microsoft Decision 1 Reassessment (2026-10-10). PR
  #58 pinned 5136f192d583a5bf53adeeec4b0f21369b005c9d; inspected in maintained documentation
  2026-10-11, not runtime reverified'
