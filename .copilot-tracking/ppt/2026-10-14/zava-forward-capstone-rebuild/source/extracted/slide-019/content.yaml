speaker_notes: 'Threats include unauthorized writes, stale approvals, cross-case leakage,
  malicious content in evidence, model hallucination and lost or competing state.
  Proposed controls are one API write path, server-side role/case/field projections,
  source-bound inputs, schema validation, independent reviewers, row-version concurrency,
  idempotent transitions and replayable audit.


  SQL indexes and server-side paging/clustering address full-file and full-map mechanisms.
  Queue-separated workers and private-only access remain proposed topology, not deployed
  facts. Model failure retains manual work; unsupported source facts stay unknown;
  retries must not duplicate transitions. Blob versions and SQL metadata must identify
  exactly which evidence was approved. Recovery, ledger verification, replicas, user
  identity, leakage/injection tests and legal retention decisions need explicit observed
  evidence before readiness claims.


