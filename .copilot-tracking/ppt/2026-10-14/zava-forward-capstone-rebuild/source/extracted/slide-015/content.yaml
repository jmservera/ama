speaker_notes: 'The ambition is large; the first change should be small enough to
  learn from. Start with existing teams and suppliers, and one connected home.


  The Programme Manager and staff co-design tasks and profile workbook ownership.
  The Data owner shadows one-way imports and owns quarantine and reconciliation. Team
  leads rehearse role-specific tasks with named support. Digital and the work owner
  agree exit tests and prove rollback before switching the write path.


  Keep parallel entry short and explicitly owned. After sign-off, the workbench writes
  and Excel reports through the API. No permanent dual entry, compulsory portal or
  big-bang replacement.


  These are proposed owner roles, not confirmed delegations. Validate tenant, workbook
  quality, accessibility and staff readiness. Count transition and training effort
  in the business case.


  Evidence:

  docs/reference/research/company/pilot-measurement-challenge.md — Owner Decision,
  2026-09-26.

  docs/adrs/0001-azure-architecture.md — Hybrid M365 and Excel transition (proposed).

  docs/reference/research/ux/zava-forward-prototype-profile-review.md — Owner Usability
  Feedback; Proposed Acceptance Checks (2026-10-07).'
