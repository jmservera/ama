speaker_notes: 'We challenged the request through eight role-agent instruments: Assets,
  Programme, Finance, Procurement, Resident Engagement, Building Safety, Data and
  Performance, and a Neighbourhood Housing Officer. These were sector-informed research
  instruments, not interviews with employees or company approvals.


  Their shared finding was a reversal: every end-to-end request bundles controls,
  accountable decisions and narrower AI work. Each proposed agent needs the same reliable
  records and lifecycle underneath it. Richer photos, invoices or sensor inputs do
  not remove that need.


  We do not yet know the binding delivery constraint. Capital, capacity, access or
  quality may dominate administration. That uncertainty argues for visibility and
  measurement before automation—not for five larger black boxes.


