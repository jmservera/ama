speaker_notes: 'Sixty thousand homes. Behind that number are residents waiting for
  warmth, and a small team trying to hold a complex retrofit programme together. Zava
  North Homes asked for five agents. That is a reasonable request: help us move faster.


  The promise is safe, resident-accepted homes and explainable decisions. Our proposal
  changes how work becomes accountable, not the whole company.


  Today, endorse preparation of a gated evidence-stage proposal. No procurement, spending
  or production authority is requested. First, let me show why the evidence changed
  what we should build.


  Evidence:

  docs/case_study_48_original.md — Business Challenge; Agentic Architecture Brief;
  Expected Outcomes (2026-09-10, immutable request).

  docs/case_study_48_addendum.md — Zava Forward at Zava North Homes; Business Challenge;
  Executive Assessment (2026-10-11, proposal).'
