  docs/case_study_48_addendum.md — Subsequent Application Exercise Builds; Current
  Learning and Parallel Experiment (2026-10-11).

  docs/adrs/0001-azure-architecture.md; docs/adrs/0002-pilot-readiness-architecture.md
  — Exercise Applicability; Decisions (proposed).

  docs/ideas/typesafe-system-one-agent-fit.md — Observed Feasibility and Parallel
  Value Experiment (pinned #58).'
