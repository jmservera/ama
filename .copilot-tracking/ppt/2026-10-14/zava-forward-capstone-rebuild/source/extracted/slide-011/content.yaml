speaker_notes: 'One controlled API mediates intake and staff action requests. It checks
  role, case and field permissions, evidence versions and approvals before SQL state
  changes. Versioned Blob evidence supports the trace. Deterministic workflow controls
  ranking, gates and routing.


  AI receives permitted inputs and returns a cited draft or flag to staff. It has
  no write credentials. Human review comes before a controlled action; model failure
  retains the manual route without bypassing gates.


  Actual Azure, SQL and AI are the exercise direction—not customer procurement approval
  or a universal requirement for agent transformation. Pinned #58 documents narrow
  feasibility, not this entire design. CIO assurance still requires permission, leakage,
  recovery and resilience tests.


