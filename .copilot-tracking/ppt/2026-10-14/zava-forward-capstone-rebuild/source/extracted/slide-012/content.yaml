speaker_notes: 'Give AI a bounded task, not an office of authority. A decision model
  may select among supplied, source-bound candidates when verified task fit supports
  it. It must allow no-match or uncertainty. A generative model may assemble a cited
  narrative from permitted evidence.


  Staff check required fields and own the decision. Priority policy, consent, technical
  acceptance, claims, quality and payment are never AI-owned.


  Pinned #58 records source-bound EPC selection and cited generation feasibility.
  That does not establish calibration, broader screening or net benefit.


  If review and correction erase the benefit, keep the simpler path. Real inference
  is exercise evidence; usefulness needs a separate test.


  Evidence:

  docs/ideas/typesafe-system-one-agent-fit.md — Microsoft Decision 1 Reassessment;
  Observed Feasibility and Parallel Value Experiment (2026-10-10/11, #58 pinned at
  5136f192d583a5bf53adeeec4b0f21369b005c9d).

  docs/case_study_48_addendum.md — Subsequent Application Exercise Builds (2026-10-11).'
