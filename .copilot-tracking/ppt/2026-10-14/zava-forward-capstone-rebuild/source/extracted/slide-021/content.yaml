speaker_notes: 'Evidence categories: REQUEST is the immutable case ambition; RESEARCH
  is sector evidence or role-agent hypothesis; EXERCISE is a selected fictional fixture
  or historical owner-approved baseline; DIRECTION is the current owner''s delivery
  requirement; PROPOSED is design or evaluation not yet accepted; OBSERVED FEASIBILITY
  is a precisely pinned recorded service result; UNPROVED is benefit or readiness
  still lacking evidence.


  All consequential legal adoption requires fresh official-source verification and
  professional/control-owner approval. v0.12 acceptance on 10 October does not transfer
  to v0.13. PR #58 evidence is pinned at 5136f192d583a5bf53adeeec4b0f21369b005c9d
  in maintained main documentation, not imported source or a re-inspected runtime.


  The full capstone guide informed the narrative. A deck cannot establish live delivery,
  Q&A behaviour, working autonomy, operations or publication floors. Earlier reviews
  applied to earlier narratives and are historical, not current approval. Independent
  final review of this rebuilt narrative is handled by the parent; a timed rehearsal
  remains pending. Detailed source/provision/date/status references are in notes and
  research/evidence-register.md.


  Evidence:

  docs/case_study_48_original.md — Business Challenge; Agentic Architecture Brief;
  Expected Outcomes (2026-09-10, immutable request)

  docs/reference/research/company/agent-request-challenge.md — Purpose and Method;
  Summary (2026-09-26, role-agent hypotheses)

  docs/case_study_48_addendum.md — Owner-Approved Exercise Baseline (2026-10-10);
  EXA-001/002/004/005/008/010/011/012/013/015/016; Numerical Targets and Attribution
  (historical accepted exercise assumptions)

  docs/case_study_48_addendum.md — Subsequent Application Exercise Builds (2026-10-11);
  Current Learning and Parallel Experiment (owner direction; feasibility not benefit)

  docs/prds/zava-forward-retrofit-programme-demonstrator.md — front matter; Executive
  Summary; CON-009/AC-057 (v0.13.0 candidate 2026-10-11; historical v0.12.0 accepted
  2026-10-10)

  docs/ideas/typesafe-system-one-agent-fit.md — Observed Feasibility and Parallel
  Value Experiment (2026-10-11); Microsoft Decision 1 Reassessment (2026-10-10). PR
  #58 pinned 5136f192d583a5bf53adeeec4b0f21369b005c9d; inspected in maintained documentation
  2026-10-11, not runtime reverified

  docs/reference/method/ama-capstone-assessment-guide.md — Sections A-D; How the outcome
  is determined; How to prepare (2026-09-30 published rubric)'
