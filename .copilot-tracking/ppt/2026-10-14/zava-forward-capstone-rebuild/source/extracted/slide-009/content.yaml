speaker_notes: 'A regulated landlord needs more than a persuasive explanation. It
  needs a trace another person can inspect.


  For each decision, retain the source and evidence version, applicable rule version,
  result and reason, named reviewer, approval event and timestamp. If someone overrides
  the result, capture their authority and reason. If evidence changes, reopen dependent
  reviews and preserve the earlier story.


  That is how an executive answers: why this home, why this release, why this payment?
  AI-generated prose cannot substitute for the trace.


  Regulatory updates enter a managed source register; accountable professionals approve
  changed interpretations and rules. This pitch uses dated repository evidence, not
  a fresh legal-currentness review. Compliance and technical acceptance stay human-owned.


  Evidence:

  docs/case_study_48_addendum.md — Regulatory Evidence and Service Design; EXA-003/005/006
  (2026-10-11).

  docs/adrs/0001-azure-architecture.md — Decisions; Exercise Applicability (2026-10-11,
  proposed).'
