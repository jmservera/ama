speaker_notes: 'A dashboard tells us what is happening; it does not establish what
  caused it. Separate two questions.


  First, does modernisation improve accepted outcomes? Compare an assisted locality
  with a matched locality using existing delivery without agents, both with existing
  teams, identical event capture and a frozen cohort. Compare changes against each
  area''s instrumented pre-period. Log shared suppliers and staff so improvement is
  not borrowed from elsewhere. Do not introduce a protected delivery cell and call
  its capacity an AI benefit.


  Second, does a capability add value over the same workflow without it? Pair identical
  inputs and reviewed tasks. Count review, correction, recording, errors, latency
  and cost.


  Include unfinished, paused and withdrawn homes. Safety, resident choice, quality,
  equity and peak cash cannot be traded for speed. Protocol and thresholds need owner
  agreement. No numerical effects are measured here; a negative AI result means simplify.


  Evidence:

  docs/reference/research/company/pilot-measurement-challenge.md — Summary; Owner
  Decision, 2026-09-26; Proposed Measurement Design; Analysis Rules.

  docs/ideas/typesafe-system-one-agent-fit.md — Observed Feasibility and Parallel
  Value Experiment (2026-10-11, protocol not results).'
