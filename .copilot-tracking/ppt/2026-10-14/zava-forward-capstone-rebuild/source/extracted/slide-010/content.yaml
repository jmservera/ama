speaker_notes: 'Here is the product in its context. Existing workbooks, housing and
  stock records, surveys and funding rules feed the workbench through validated intake.
  The arrow runs from sources into the shared case—not backwards.


  Staff use role queues over that case. Residents receive supported contact, contractors
  exchange scoped work and evidence through approved channels, and Excel receives
  reporting views. Neither residents nor contractors need open access to the internal
  tool.


  We keep useful systems and clarify which source owns each fact. Conflicting identifiers
  are quarantined, not silently merged. This is a proposed landscape, not a deployed
  topology or an all-systems migration.


