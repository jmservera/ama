  docs/case_study_48_addendum.md — EXA-003/004/005 (2026-10-10 exercise assumptions).

  docs/prds/zava-forward-retrofit-programme-demonstrator.md — Executive Summary (v0.13
  candidate).

  docs/adrs/0001-azure-architecture.md — Hybrid M365 and Excel transition; Decisions
  (2026-10-11 proposed).'
