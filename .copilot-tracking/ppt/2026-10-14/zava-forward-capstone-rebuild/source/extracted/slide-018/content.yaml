speaker_notes: 'The ask is not to replace how the whole company works. Endorse preparation
  of a gated evidence-stage proposal for the shared foundation these five capabilities
  need.


  CEO and Assets: name a sponsor and workflow and control owners. CFO: define the
  affordability, whole-life cost and spending-authority review. CIO and Programme:
  define enforceable controls, resilience and supported transition evidence. Confirm
  actual delegations.


  Return at a date you agree with reviewed requirements, fair Excel-only and M365
  alternatives, scoped costs, acceptance tests and stop conditions. No purchase, deployment
  or production is authorized today.


  You asked for agents to help deliver the promise. Our recommendation is to make
  the work visible, measurable and explainable—so assistance can earn its place, and
  every accepted home has a story you can stand behind.


  Evidence:

  docs/case_study_48_addendum.md — Executive Assessment; Recommended Executive Decision;
  Subsequent Application Exercise Builds (2026-10-11, proposal).

  docs/reference/research/company/company-profile-research.md — Role and Decision
  Map (2026-09-26, proposed role boundaries).'
