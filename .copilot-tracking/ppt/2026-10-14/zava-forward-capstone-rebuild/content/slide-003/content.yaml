  \ proposal; refreshed 14 October 2026.\n\n\"Eight sector-informed role-agent perspectives challenged\
  \ the\n  request; they are research instruments, not the company's staff or\n  approvers. Each request\
  \ combines deterministic controls, accountable\n  decisions and narrower text/evidence tasks. Richer\
  \ inputs do not remove\n  those boundaries. The binding delivery constraint is still unknown:\n  capital,\
  \ competent capacity, access or quality may dominate coordination.\"\n* Transition: \"Three examples\
  \ explain why that changes the build.\"\n\nSources — workspace-relative paths, section and evidence\
  \ status; as read 14 October 2026:\nS02: docs/case_study_48_addendum.md, Business Challenge; Executive\
  \ Assessment; Digital Foundation; Where Agents Fit; Recommended Executive Decision. Status: Maintained\
  \ 14 October synthesis and proposed controls; bottleneck/outcomes not verified company findings.\nS04:\
  \ docs/reference/research/company/agent-request-challenge.md, Summary and capability sections; docs/reference/research/company/agent-what-if-study.md,\
  \ method and revised verdicts, as carried in S02. Status: Sector-informed role-agent hypotheses, not\
  \ employee interviews or resident testimony.\n\nPlanned allocation: 35 seconds; not rehearsed."
