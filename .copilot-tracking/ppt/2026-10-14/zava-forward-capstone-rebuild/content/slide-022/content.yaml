speaker_notes: "SLIDE 22 — Compare equivalent routes before selecting a winner.\nTopic sentinel: options\n\
  Message: production platform choice must earn customer value, not follow the capstone preference.\n\
  Status: strategist-recommended proposal; refreshed 14 October 2026.\n\n\"Compare workflow/evidence,\
  \ permissions, migration, integration,\n  resident access, whole-life cost and readiness on the same\
  \ journey and\n  controls. Include safety hold, withdrawal, missing evidence and failed\n  integration.\
  \ Confirm tenant, workbook quality, skills, licences and\n  support; no Dataverse or Dynamics estate\
  \ is available for assumed reuse.\n  The Azure-led hybrid is the provisional exercise direction. Historical\n\
  \  architect-proposed weights/scores are not customer-approved comparative\n  evidence. A safety/privacy/consent/approval\
  \ failure is a gate, not a score\n  that another attractive feature can offset. Select the supportable\
  \ option\n  that meets controls at justified whole-life cost, even if simpler.\"\n\nSources — workspace-relative\
  \ paths, section and evidence status; as read 14 October 2026:\nS02: docs/case_study_48_addendum.md,\
  \ Business Challenge; Executive Assessment; Digital Foundation; Where Agents Fit; Recommended Executive\
  \ Decision. Status: Maintained 14 October synthesis and proposed controls; bottleneck/outcomes not verified\
  \ company findings.\nS03: docs/reference/research/company/company-profile-research.md, Confirmed Company\
  \ Information; Role and Decision Map; Priority Company Gaps; Evidence Limitations. Status: Owner-confirmed\
  \ not-for-profit; modelled company/resident/finance attributes are not company facts or delegations.\n\
  S07: docs/prds/zava-forward-retrofit-programme-demonstrator.md, v0.14 front matter; component contracts;\
  \ threat model; Five Reactive and Proactive Assistants; orchestration; evaluation; current handoff.\
  \ Status: Current candidate, 47 FRs/61 ACs; fresh requirements review and amended owner acceptance open;\
  \ CON-009/AC-057 full acceptance not passed.\nS12: docs/adrs/0001-azure-architecture.md, Hybrid M365\
  \ and Excel transition; Options still to compare; provisional appraisal. Status: Proposed transition/full\
  \ topology and historical illustration, not current deployment or scored customer platform choice.\n\
  \nOptional appendix, outside the planned 795-second main route."
