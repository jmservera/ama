speaker_notes: "SLIDE 10 — One workbench beside the systems you keep.\nTopic sentinel: system context\n\
  Message: retain source ownership while connecting case work.\nStatus: strategist-recommended proposal;\
  \ refreshed 14 October 2026.\n\n\"The arrow is from source material into validated intake, not an\n\
  \  uncontrolled write-back loop. The case connects home, building and package\n  context with roles\
  \ and evidence. Residents and suppliers need supported,\n  scoped exchange, not open access to the internal\
  \ staff workbench.\n  Housing/repairs integrations, M365 document channels and import transition\n \
  \ remain proposals or unverified. An integration picture is not a deployed\n  connection receipt.\"\n\
  * Transition: \"The API is the authority boundary, not the model.\"\n\nSources — workspace-relative\
  \ paths, section and evidence status; as read 14 October 2026:\nS07: docs/prds/zava-forward-retrofit-programme-demonstrator.md,\
  \ v0.14 front matter; component contracts; threat model; Five Reactive and Proactive Assistants; orchestration;\
  \ evaluation; current handoff. Status: Current candidate, 47 FRs/61 ACs; fresh requirements review and\
  \ amended owner acceptance open; CON-009/AC-057 full acceptance not passed.\nS11: mvp/README.md, Honest\
  \ limits; Five retrofit assistants; Operator authority; current delivery paragraphs; mvp/zavaforward_mvp/assistants.py,\
  \ REGISTRY/RULES/capture/eligible/review. Status: Source and documented implementation; captured metadata/category\
  \ citations, not unrestricted document reading, human source review or semantic entailment.\nS12: docs/adrs/0001-azure-architecture.md,\
  \ Hybrid M365 and Excel transition; Options still to compare; provisional appraisal. Status: Proposed\
  \ transition/full topology and historical illustration, not current deployment or scored customer platform\
  \ choice.\n\nPlanned allocation: 30 seconds; not rehearsed."
