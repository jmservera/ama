speaker_notes: "SLIDE 06 — Every handoff needs an owner and a next action.\nTopic sentinel: work contract\n\
  Message: observable work starts with a work contract, not a dashboard.\nStatus: strategist-recommended\
  \ proposal; refreshed 14 October 2026.\n\n\"The sender retains chase responsibility until the receiver\n\
  \  accepts. Record the next action, resident-update owner and relevant clocks.\n  Material evidence\
  \ changes reopen dependent reviews, not unrelated sibling\n  decisions. Recording itself costs effort;\
  \ include it in the value test.\n  Hazard intake remains independent of routine handoff waiting.\"\n\
  * Transition: \"Follow that contract through one home.\"\n\nSources — workspace-relative paths, section\
  \ and evidence status; as read 14 October 2026:\nS02: docs/case_study_48_addendum.md, Business Challenge;\
  \ Executive Assessment; Digital Foundation; Where Agents Fit; Recommended Executive Decision. Status:\
  \ Maintained 14 October synthesis and proposed controls; bottleneck/outcomes not verified company findings.\n\
  S05: docs/reference/research/company/pilot-measurement-challenge.md, Owner Decision; Proposed Measurement\
  \ Design; Freeze/Analysis; Guardrails. Status: Proposed comparisons and protected outcomes, not executed\
  \ experiments.\nS06: docs/case_study_48_addendum.md, EXA-002/003/004/005/007/008/010/011/012/013/015;\
  \ Numerical Targets and Attribution; Subsequent Application Exercise Builds. Status: Historical selected\
  \ exercise assumptions; explicitly fictional costs/terms, not budgets, awards or current open authority.\n\
  S07: docs/prds/zava-forward-retrofit-programme-demonstrator.md, v0.14 front matter; component contracts;\
  \ threat model; Five Reactive and Proactive Assistants; orchestration; evaluation; current handoff.\
  \ Status: Current candidate, 47 FRs/61 ACs; fresh requirements review and amended owner acceptance open;\
