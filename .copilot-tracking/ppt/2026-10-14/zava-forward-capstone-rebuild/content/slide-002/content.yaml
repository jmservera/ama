speaker_notes: "SLIDE 02 — Five pressure points. One accepted home.\nTopic sentinel: five asks\nMessage:\
  \ keep the five requested capabilities accountable to the same endpoint.\nStatus: strategist-recommended\
  \ proposal; refreshed 14 October 2026.\n\n\"You asked for help with prioritisation, assessment, funding,\n\
  \  coordination and quality. That request remains the spine of the proposal.\n  Doubling delivery and\
  \ reducing bills were ambitions in the original case,\n  not outcomes this exercise has established.\
  \ A better draft does not\n  manufacture a survey, a crew, consent or cash.\"\n* Transition: \"We challenged\
  \ what each end-to-end request actually contains.\"\n\nSources — workspace-relative paths, section and\
  \ evidence status; as read 14 October 2026:\nS01: docs/case_study_48_original.md, Business Challenge;\
  \ Architecture Brief; Expected Outcomes. Status: Original 10 September request; 60,000-home case, five\
  \ pressure points, not achieved benefits.\nS02: docs/case_study_48_addendum.md, Business Challenge;\
  \ Executive Assessment; Digital Foundation; Where Agents Fit; Recommended Executive Decision. Status:\
  \ Maintained 14 October synthesis and proposed controls; bottleneck/outcomes not verified company findings.\n\
  \nPlanned allocation: 25 seconds; not rehearsed."
