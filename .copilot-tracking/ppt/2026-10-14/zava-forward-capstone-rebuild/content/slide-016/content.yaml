speaker_notes: "SLIDE 16 — Prove the programme. Test the AI separately.\nTopic sentinel: two comparisons\n\
  Message: a fair counterfactual, not a dashboard, establishes incremental value.\nStatus: strategist-recommended\
  \ proposal; refreshed 14 October 2026.\n\n\"Compare changes against an instrumented pre-period and concurrent\n\
  \  matched delivery, logging shared staff/suppliers and displacement. The\n  twelve-month reconstruction\
  \ is context, not the counterfactual by itself.\n  At task level pair the same inputs and count gathering,\
  \ preparation,\n  review, correction, re-review and shifted burden. Proposed 20% cycle-time\n  and 25%\
  \ coordination-effort reductions remain hypotheses, not ratified or\n  measured benefits. Cycle time\
  \ is assessment-to-ready-to-install; accepted\n  handover is separate. Freeze definitions/thresholds\
  \ before measurement;\n  keep the simpler path if AI fails value or quality tests.\"\n* Transition:\
  \ \"That tells us what the next gate must ask for.\"\n\nSources — workspace-relative paths, section\
  \ and evidence status; as read 14 October 2026:\nS02: docs/case_study_48_addendum.md, Business Challenge;\
  \ Executive Assessment; Digital Foundation; Where Agents Fit; Recommended Executive Decision. Status:\
  \ Maintained 14 October synthesis and proposed controls; bottleneck/outcomes not verified company findings.\n\
  S05: docs/reference/research/company/pilot-measurement-challenge.md, Owner Decision; Proposed Measurement\
  \ Design; Freeze/Analysis; Guardrails. Status: Proposed comparisons and protected outcomes, not executed\
  \ experiments.\nS07: docs/prds/zava-forward-retrofit-programme-demonstrator.md, v0.14 front matter;\
  \ component contracts; threat model; Five Reactive and Proactive Assistants; orchestration; evaluation;\
  \ current handoff. Status: Current candidate, 47 FRs/61 ACs; fresh requirements review and amended owner\
  \ acceptance open; CON-009/AC-057 full acceptance not passed.\nS10: .copilot-tracking/reviews/logs/2026-10-14/five-assistant-live-delivery-review.md,\
  \ Completed Work; Validation; RV-001/RV-002; Outcome. Status: Technical Review Complete / Residual work,\
  \ not blanket product conformance.\n\nPlanned allocation: 50 seconds; not rehearsed."
