speaker_notes: "SLIDE 05 — Change the handoffs, not the whole company.\nTopic sentinel: shared foundation\n\
  Message: modernise coordination around existing people and systems.\nStatus: strategist-recommended\
  \ proposal; refreshed 14 October 2026.\n\n\"The proposal is a programme control and evidence layer,\
  \ not\n  replacement of the housing organisation. Keep useful systems, teams and\n  suppliers. Introduce\
  \ an owned case and a controlled transition from source\n  spreadsheets to API-fed reporting. Neither\
  \ the integration nor the reduction\n  in duplicate effort is accepted simply because it appears in\
  \ the design.\"\n* Transition: \"A handoff becomes useful when its contract is explicit.\"\n\nSources\
  \ — workspace-relative paths, section and evidence status; as read 14 October 2026:\nS02: docs/case_study_48_addendum.md,\
  \ Business Challenge; Executive Assessment; Digital Foundation; Where Agents Fit; Recommended Executive\
  \ Decision. Status: Maintained 14 October synthesis and proposed controls; bottleneck/outcomes not verified\
  \ company findings.\nS07: docs/prds/zava-forward-retrofit-programme-demonstrator.md, v0.14 front matter;\
  \ component contracts; threat model; Five Reactive and Proactive Assistants; orchestration; evaluation;\
  \ current handoff. Status: Current candidate, 47 FRs/61 ACs; fresh requirements review and amended owner\
  \ acceptance open; CON-009/AC-057 full acceptance not passed.\nS12: docs/adrs/0001-azure-architecture.md,\
  \ Hybrid M365 and Excel transition; Options still to compare; provisional appraisal. Status: Proposed\
  \ transition/full topology and historical illustration, not current deployment or scored customer platform\
  \ choice.\n\nPlanned allocation: 30 seconds; not rehearsed."
