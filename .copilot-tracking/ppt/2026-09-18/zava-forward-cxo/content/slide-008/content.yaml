speaker_notes: 'A pilot passes only if it improves accepted outcomes without weakening

  safety, resident rights, quality or affordability. Proposed cycle-time and

  administration targets are unratified until readiness. Keep absolute

  exceptions visible. A small pilot cannot prove universal safety or seasonal

  energy and affordability outcomes.

