  width: 5.75
  height: 4.82
  fill: '#E7F6F3'
  line_color: '#1B998B'
  text: 'THE SERVICE MAY


    Recommend priorities

    Reconcile records and flag conflicts

    Pre-populate sourced facts

    Draft resident, grant and management packs

    Suggest schedules within confirmed constraints

    Check evidence and flag anomalies'
  text_font: Aptos
  text_size: 17
  text_color: '#0B625B'
  text_bold: false
- type: shape
  shape: rounded_rectangle
  left: 6.86
  top: 1.5
  width: 5.75
  height: 4.82
  fill: '#FCE8E6'
  line_color: '#C44536'
  text: 'THE SERVICE MUST NOT


    Diagnose hazards

    Release a safety hold

    Approve PAS 2035 outputs

    Infer resident consent

    Commit capital or award work

    Submit claims, accept quality or close defects'
  text_font: Aptos
  text_size: 17
  text_color: '#7A271A'
  text_bold: false
- type: textbox
  left: 1.28
  top: 6.55
  width: 10.8
  height: 0.35
  text: Deterministic workflow enforces the gate. An authorised person makes the controlled
    decision.
  font: Aptos
  font_size: 15
  font_color: '#243B53'
  font_bold: true
