speaker_notes: 'Use the exact verbs recommend, draft, reconcile and flag. Competent

  professionals own PAS 2035 outputs. Residents retain measure-specific

  decisions. Finance, safety, procurement and quality authorities retain their

  mandates. Resident silence, survey access or an accepted appointment must

  never be interpreted as installation consent.

  '
