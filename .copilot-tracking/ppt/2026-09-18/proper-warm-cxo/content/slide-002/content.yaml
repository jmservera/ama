    font: "Aptos"
    font_size: 10
    font_color: "#627D98"
speaker_notes: |
  Avoid criticising the current team or spreadsheets. Spreadsheet dependency
  signals fragmented coordination, but it does not prove administration is the
  binding constraint. Define delivery as a safe, resident-accepted,
  evidence-complete handover. Readiness must identify which constraints
  materially limit that outcome.
