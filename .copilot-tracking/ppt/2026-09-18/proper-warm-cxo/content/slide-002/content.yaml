  - type: textbox
    left: 0.68
    top: 0.42
    width: 11.9
    height: 0.72
    text: "The delivery challenge is credible; its binding cause is not yet known"
    font: "Aptos Display"
    font_size: 27
    font_color: "#102A43"
    font_bold: true
  - type: shape
    shape: rounded_rectangle
    left: 0.72
    top: 1.55
    width: 3.65
    height: 4.65
    fill: "#FFFFFF"
    line_color: "#B8C7D9"
    text: "KNOWN\n\n60,000 homes\n\nSmall spreadsheet-led team\n\nDelivery described as behind plan"
    text_font: "Aptos"
    text_size: 18
    text_color: "#243B53"
    text_bold: false
  - type: shape
    shape: rounded_rectangle
    left: 4.78
    top: 1.55
    width: 3.65
    height: 4.65
    fill: "#FFF8E6"
    line_color: "#F2C14E"
    text: "POSSIBLE CONSTRAINTS\n\nData quality\nCapital and cash\nCompetent capacity\nSupplier capacity\nProperty complexity\nResident access\nQuality failure\nGrant conditions"
    text_font: "Aptos"
    text_size: 17
    text_color: "#5F4B00"
    text_bold: false
  - type: shape
    shape: rounded_rectangle
    left: 8.84
    top: 1.55
    width: 3.77
    height: 4.65
    fill: "#FCE8E6"
    line_color: "#C44536"
    text: "EXECUTIVE RISK\n\nAutomating the wrong constraint makes activity faster - not outcomes better.\n\nSuccess means an accepted handover, not a task completed."
    text_font: "Aptos"
    text_size: 18
    text_color: "#7A271A"
    text_bold: false
  - type: textbox
    left: 0.72
    top: 6.68
    width: 11.9
    height: 0.25
