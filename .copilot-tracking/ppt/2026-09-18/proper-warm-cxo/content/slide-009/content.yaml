speaker_notes: |
  Technology value must be incremental to the underlying retrofit plan and
  exceed its full operating and assurance burden. Staff time released is
  capacity, not a cash saving unless expenditure changes. Existing-plan grant
  is not an incremental benefit. Measure resident comfort, affordability and
  bill effects separately.
