    width: 10.53
    height: 0.92
    fill: "#102A43"
    line_color: "#102A43"
    text: "ATTRIBUTABLE BENEFIT - DATA - INTEGRATION - PEOPLE - REVIEW - ASSURANCE - SUPPORT - EXIT"
