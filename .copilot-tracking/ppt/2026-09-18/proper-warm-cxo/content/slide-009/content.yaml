    text: "VALUE HYPOTHESES\n\nFewer avoidable delays and repeat work\nBetter grant claim and cash conversion\nBetter alignment of retrofit and maintenance\nClearer capital and downside exposure\nStronger resident, Board and audit evidence"
    text_font: "Aptos"
    text_size: 17
    text_color: "#0B625B"
    text_bold: false
  - type: shape
    shape: rounded_rectangle
    left: 6.86
