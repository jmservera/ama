speaker_notes: |
  Answer the executive question: what are we buying in eight weeks? Each
  output needs a named owner. Require a twelve-month baseline by property
  archetype, measure, supplier and lifecycle stage, including reopened work.
  If coordination is not a material constraint, do not force an agentic
  solution.
