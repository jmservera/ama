speaker_notes: |
  Use the numbers to make one point: even the scenario implies material
  provider funding and delivery exposure. Do not present the 74% EPC C sector
  estimate as the Proper North Homes baseline. Finance must validate eligible
  homes, award status, cost inclusions, match funding, peak cash, covenant
  headroom and downside tolerances.
